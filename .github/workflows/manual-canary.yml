# This workflow allows maintainers to manually run the canary given an external contributor's pull request created from
# a forked repository, which does not have required repository secrets to execute the canary.
name: Invoke Canary as Maintainer
on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: The PR number to invoke the canary for.
        required: true
        type: string
      commit_sha:
        description: The the full SHA for the HEAD commit of the PR
        required: true
        type: string
  # Second entry point: `fork-canary.yml` gates on the `safe-to-run-canary` label rather than a
  # manual dispatch, then calls this workflow. Deliberately one pipeline behind two doors -- the
  # canary steps and the build image transport live here only, so a change to either cannot be
  # applied to one entry point and missed on the other. The `commit_sha` mismatch check in
  # `get-pr-info` below is what pins both doors to the revision that was actually reviewed.
  workflow_call:
    inputs:
      pull_request_number:
        description: The PR number to invoke the canary for.
        required: true
        type: string
      commit_sha:
        description: The full SHA for the HEAD commit of the PR
        required: true
        type: string
run-name: ${{ github.workflow }} for Pull Request ${{ inputs.pull_request_number }}

# Every checkout below sets `allow-unsafe-pr-checkout: true`. `actions/checkout` refuses to fetch a
# fork's ref when the run was triggered by `pull_request_target` -- the fork-canary door -- because
# doing so executes untrusted code with the base repo's secrets. That is exactly what this workflow
# does, knowingly: running the contributor's code against the canary credentials is the whole point,
# and the gate is the `safe-to-run-canary` label, not the checkout action. `fork-canary.yml` holds
# the reasoning and the guards (write-access labeler, fork-only, SHA pinned and re-asserted below,
# label revoked on every push). The flag is inert on the `workflow_dispatch` door, where a
# maintainer's dispatch is already the attestation.

# Allow one instance of this workflow per pull request, and cancel older runs when new changes are pushed
concurrency:
  group: manual-canary-${{ inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  get-pr-info:
    name: Get PR info
    runs-on: ubuntu-latest
    steps:
    - uses: GitHubSecurityLab/actions-permissions/monitor@v1
    - name: Get PR info
      id: get-pr-info
      uses: actions/github-script@v7
      with:
        script: |
          const response = await github.rest.pulls.get({
            pull_number: ${{ inputs.pull_request_number }},
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          const data = {
            commit_sha: response.data.head.sha,
          };
          console.log("data:", data);
          if(data.commit_sha !== "${{ inputs.commit_sha }}"){
            throw new Error("Input SHA does not match retrieved SHA")
          }
          return data;
    outputs:
      pull_data: ${{ steps.get-pr-info.outputs.result }}

  acquire-base-image:
    name: Acquire Base Image
    permissions:
      id-token: write
      contents: read
    needs:
    - get-pr-info
    # The other three workflows that build this image all use the 8-core runner. On `ubuntu-latest`
    # the build is killed part-way -- a dispatch against a fork PR on 2026-08-20 ran 64 minutes and
    # died with the step still in progress. That path had been broken for any fork PR whose image
    # tag wasn't already in ECR, and `fork-canary.yml` now calls this workflow.
    runs-on: smithy_ubuntu-latest_8-core
    steps:
    - uses: GitHubSecurityLab/actions-permissions/monitor@v1
    - uses: actions/checkout@v4
      with:
        path: smithy-rs
            # The ref used needs to match the HEAD revision of the PR being diffed, or else
            # the `docker-build` action won't find the built Docker image.
        ref: ${{ inputs.commit_sha }}
        fetch-depth: 0
        allow-unsafe-pr-checkout: true
    - uses: ./smithy-rs/.github/actions/free-disk-space
    - name: Acquire base image
      id: acquire
      run: ./smithy-rs/.github/scripts/acquire-build-image
    - name: Upload base image
      uses: ./smithy-rs/.github/actions/upload-base-image

  generate:
    name: Generate
    needs:
    - acquire-base-image
    - get-pr-info
    runs-on: smithy_ubuntu-latest_8-core
    steps:
    - uses: GitHubSecurityLab/actions-permissions/monitor@v1
    - uses: actions/checkout@v4
      with:
        path: smithy-rs
        ref: ${{ inputs.commit_sha }}
        allow-unsafe-pr-checkout: true
    - name: Generate a subset of SDKs for the canary
      uses: ./smithy-rs/.github/actions/docker-build
      with:
        action: generate-aws-sdk-for-canary

  canary:
    name: Canary
    needs:
    - generate
    - get-pr-info
    runs-on: smithy_ubuntu-latest_8-core
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: GitHubSecurityLab/actions-permissions/monitor@v1
    - uses: actions/checkout@v4
      with:
        path: smithy-rs
        ref: ${{ inputs.commit_sha }}
        allow-unsafe-pr-checkout: true
    - name: Configure credentials
      id: creds
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: us-west-2
        role-to-assume: ${{ secrets.CANARY_GITHUB_ACTIONS_ROLE_ARN }}
        output-credentials: true
    - name: Run canary
      uses: ./smithy-rs/.github/actions/docker-build
      with:
        action: run-canary
        action-arguments: ${{ secrets.CANARY_STACK_CDK_OUTPUTS_BUCKET_NAME }} ${{ steps.creds.outputs.aws-access-key-id }} ${{ steps.creds.outputs.aws-secret-access-key }} ${{ steps.creds.outputs.aws-session-token }} x86_64

  canary-arm:
    name: Canary (aarch64)
    needs:
    - generate
    - get-pr-info
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        path: smithy-rs
        ref: ${{ inputs.commit_sha }}
        allow-unsafe-pr-checkout: true
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: artifacts-generate-aws-sdk-for-canary
        path: artifacts-generate-aws-sdk-for-canary
    - name: Extract artifacts
      run: tar xfz artifacts-generate-aws-sdk-for-canary/artifacts-generate-aws-sdk-for-canary.tar.gz
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-unknown-linux-musl
    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y musl-tools cmake perl clang pkg-config
    - name: Configure credentials
      id: creds
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.CANARY_GITHUB_ACTIONS_ROLE_ARN }}
        role-session-name: GitHubActions
        aws-region: us-west-2
        output-credentials: true
    - name: Run canary
      run: |
        export RUST_STABLE_VERSION="$(rustc --version | cut -d' ' -f2)"
        # Install the pinned toolchain from rust-toolchain.toml and add musl target
        rustup toolchain install 1.94.1
        rustup target add aarch64-unknown-linux-musl wasm32-wasip2 --toolchain 1.94.1
        ./smithy-rs/tools/ci-scripts/run-canary \
          ${{ secrets.CANARY_STACK_CDK_OUTPUTS_BUCKET_NAME }} \
          ${{ steps.creds.outputs.aws-access-key-id }} \
          ${{ steps.creds.outputs.aws-secret-access-key }} \
          ${{ steps.creds.outputs.aws-session-token }} \
          aarch64
