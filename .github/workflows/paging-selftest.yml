#
# Exercises the paging chain on its own: datapoint -> alarm -> ticket.
#
# Nothing here builds anything, and it is never part of a release. The canary's own alarm is armed
# per release and fires only when a published crate is broken, which is a terrible way to find out
# whether the chain works at all. This writes a datapoint by hand instead, so every link can be
# checked before anything depends on it.
#
# Run it as discrete actions rather than end to end, because the things worth checking are what
# happens *between* them and most of them fail silently:
#
#   arm     create the alarm, then read it back. Also prints the alarm action verbatim, which is how
#           the `+` versus `%20` encoding of spaces in the action gets settled by observation.
#   fire    write one datapoint. The first fire should cut a ticket; a second fire with the same
#           session should append to it rather than cut another.
#   status  the alarm's state and its recent transitions, to watch it age back to OK.
#   disarm  delete the alarm. Deleting is routine rather than exceptional -- every release deletes
#           the previous release's alarm while a ticket may still be open against it -- so whether
#           that releases the ticketing system's hold has to be known.
#
# SEVERITY 2.5, everywhere, and not a parameter. Production will be 2.
#
# 2.5 pages during business hours, so run this during the working day: the notification half is the
# point, and a silent pager at night is not evidence of anything.
#
# High-severity ticketing has to be enabled for the application cutting the ticket, which is
# unverified -- so the first `fire` may be rejected rather than delivered. That is a finding, not a
# fault in this workflow.
name: Paging self-test
run-name: Paging self-test - ${{ inputs.action }} - ${{ inputs.session }}
on:
  workflow_dispatch:
    inputs:
      action:
        description: Which step of the self-test to run.
        type: choice
        options: [arm, fire, status, disarm]
        required: true
      session:
        description: >
          Names this attempt, and becomes both the alarm name and the ticket's dedupe key. Reuse the
          same value across arm/fire/fire to test that a second datapoint dedupes; change it to
          start a fresh ticket. Letters, digits and dashes only.
        type: string
        required: true
permissions:
  contents: read
jobs:
  selftest:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    # The alarm role is assumed only from here. This is also the only thing that distinguishes this
    # job from a leg, since both run in this repository.
    environment: canary-orchestrator
    steps:
    - name: Check the configuration and the session name
      id: config
      env:
        SESSION: ${{ inputs.session }}
        ROLE: ${{ secrets.BUILD_CANARY_ALARM_ROLE_ARN }}
        METRICS_ROLE: ${{ secrets.BUILD_CANARY_METRICS_ROLE_ARN }}
        TICKET_ARN_TEMPLATE: ${{ secrets.BUILD_CANARY_TICKET_ARN_TEMPLATE }}
        ACTION: ${{ inputs.action }}
      run: |
        set -euo pipefail

        # The session becomes an alarm name and a dedupe key. The alarm role may only touch alarms
        # named `paging-selftest-*`, so a name with a slash or a space would be denied with a
        # permissions error that looks nothing like the cause.
        if [[ ! "$SESSION" =~ ^[A-Za-z0-9-]+$ ]]; then
          echo "::error title=Bad session::'${SESSION}' must be letters, digits and dashes only"
          exit 1
        fi
        echo "alarm=paging-selftest-${SESSION}" >> "$GITHUB_OUTPUT"

        MISSING=()
        [[ -z "$ROLE" ]] && MISSING+=("BUILD_CANARY_ALARM_ROLE_ARN")
        # `fire` writes a datapoint, which is the metrics role's job, not the alarm role's -- the two
        # permission sets are disjoint on purpose.
        [[ "$ACTION" == "fire" && -z "$METRICS_ROLE" ]] && MISSING+=("BUILD_CANARY_METRICS_ROLE_ARN")
        [[ "$ACTION" == "arm" && -z "$TICKET_ARN_TEMPLATE" ]] && MISSING+=("BUILD_CANARY_TICKET_ARN_TEMPLATE")
        if (( ${#MISSING[@]} > 0 )); then
          echo "::error title=Not configured::set ${MISSING[*]} before running this"
          exit 1
        fi

    # `fire` needs the metrics role; everything else needs the alarm role. They are disjoint, and a
    # job holding both would defeat the split.
    - name: Assume the metrics role
      if: inputs.action == 'fire'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.BUILD_CANARY_METRICS_ROLE_ARN }}
        aws-region: us-west-2

    - name: Assume the alarm role
      if: inputs.action != 'fire'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.BUILD_CANARY_ALARM_ROLE_ARN }}
        aws-region: us-west-2

    - name: Arm
      if: inputs.action == 'arm'
      env:
        ALARM: ${{ steps.config.outputs.alarm }}
        # A template, so the public repository holds no internal ticket routing. The severity and
        # the dedupe key are substituted here, which keeps the severity visible in reviewed code
        # rather than buried in a secret.
        TICKET_ARN_TEMPLATE: ${{ secrets.BUILD_CANARY_TICKET_ARN_TEMPLATE }}
      run: |
        set -euo pipefail
        # Not the default for a `run:` step, and without it a failure in the left side of a pipe
        # below would be swallowed.
        set -o pipefail
        export AWS_RETRY_MODE=standard AWS_MAX_ATTEMPTS=3

        SEVERITY=2.5

        # Both placeholders must be present before substituting. A template with the severity
        # hardcoded would make the substitution a no-op and cut at whatever severity the secret
        # carries; one with the dedupe key hardcoded would collapse every session into one ticket.
        for PLACEHOLDER in '{severity}' '{dedupe}'; do
          if [[ "$TICKET_ARN_TEMPLATE" != *"$PLACEHOLDER"* ]]; then
            echo "::error title=Bad template::BUILD_CANARY_TICKET_ARN_TEMPLATE must contain ${PLACEHOLDER}"
            exit 1
          fi
        done

        ACTION_ARN="${TICKET_ARN_TEMPLATE//\{severity\}/$SEVERITY}"
        ACTION_ARN="${ACTION_ARN//\{dedupe\}/$ALARM}"
        if [[ "$ACTION_ARN" == *'{'* ]]; then
          echo "::error title=Template not filled::placeholders remain after substitution"
          exit 1
        fi
        if [[ "$ACTION_ARN" != arn:* ]]; then
          echo "::error title=Not an ARN::the filled template does not start with 'arn:'"
          exit 1
        fi

        # Delete first. A previous attempt with this session name would otherwise be updated rather
        # than created, and an update does not re-send to the ticketing system.
        aws cloudwatch delete-alarms --alarm-names "$ALARM" || true

        aws cloudwatch put-metric-alarm \
          --alarm-name "$ALARM" \
          --alarm-description "Paging self-test. Not a real finding: this alarm exists only to check that a datapoint reaches a ticket, and is dispatched by hand. Safe to close." \
          --namespace smithy-rs-build-canary \
          --metric-name Red \
          --dimensions "Name=Tag,Value=${ALARM}" \
          --statistic Maximum --period 60 \
          --evaluation-periods 1 --datapoints-to-alarm 1 \
          --threshold 1 --comparison-operator GreaterThanOrEqualToThreshold \
          --treat-missing-data notBreaching \
          --alarm-actions "$ACTION_ARN"

        # Read it back. This is the one job whose failure no alarm can report, because it *is* the
        # alarm, so "the step was green" has to mean "the alarm exists".
        FOUND="$(aws cloudwatch describe-alarms --alarm-names "$ALARM" \
                   --query 'length(MetricAlarms)' --output text)"
        if [[ "$FOUND" != "1" ]]; then
          echo "::error title=Alarm missing::put-metric-alarm returned success but the alarm is not there"
          exit 1
        fi

        # Printed verbatim because the encoding of spaces in the action -- `+` or `%20` -- is a
        # question nobody can answer from the documentation, and this is the observation that
        # settles it. The dimension `Tag` is the session, so this alarm cannot be tripped by a real
        # release's legs.
        echo "### Armed \`${ALARM}\` at severity ${SEVERITY}" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        aws cloudwatch describe-alarms --alarm-names "$ALARM" \
          --query 'MetricAlarms[0].{State:StateValue,Actions:AlarmActions,MissingData:TreatMissingData,Dimensions:Dimensions}' \
          | tee -a "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        echo "Next: run \`fire\` with session \`${ALARM#paging-selftest-}\` and check a ticket is cut." \
          >> "$GITHUB_STEP_SUMMARY"

    - name: Fire
      if: inputs.action == 'fire'
      env:
        ALARM: ${{ steps.config.outputs.alarm }}
      run: |
        set -euo pipefail
        export AWS_RETRY_MODE=standard AWS_MAX_ATTEMPTS=3

        # The same shape a red leg writes: Red = 1 on the series the alarm watches. The Tag is the
        # session rather than a release, so this cannot disturb a real release's series.
        aws cloudwatch put-metric-data \
          --namespace smithy-rs-build-canary \
          --metric-data "[{\"MetricName\":\"Red\",\"Value\":1,\"Unit\":\"Count\",\"Dimensions\":[{\"Name\":\"Tag\",\"Value\":\"${ALARM}\"}]}]"

        {
          echo "### Fired one datapoint at \`${ALARM}\`"
          echo ""
          echo "The alarm has a 60-second period, so allow a couple of minutes."
          echo ""
          echo "Check, in order:"
          echo "1. A ticket was cut, with dedupe key \`${ALARM}\`, into the intended category and"
          echo "   resolver group."
          echo "2. Fire again with the **same** session. The second datapoint must append to that"
          echo "   ticket rather than cut a second one, and the appended event must be *readable*"
          echo "   on the ticket. If it appears only as a link, the chat filter needs widening to"
          echo "   include modifications, not just creations."
          echo "3. Then stop firing and run \`status\` until the alarm returns to OK, which is what"
          echo "   lets the ticket be closed rather than waiting for the next release."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Status
      if: inputs.action == 'status'
      env:
        ALARM: ${{ steps.config.outputs.alarm }}
      run: |
        set -euo pipefail
        set -o pipefail
        {
          echo "### \`${ALARM}\`"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        aws cloudwatch describe-alarms --alarm-names "$ALARM" \
          --query 'MetricAlarms[0].{State:StateValue,Reason:StateReason,Updated:StateUpdatedTimestamp,MissingData:TreatMissingData}' \
          | tee -a "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

        # `notBreaching` is what makes the alarm fall back to OK once the datapoints stop. Without
        # it the alarm would sit in ALARM until the next release, and the oncall could not close the
        # ticket for as long as the gap between releases -- measured at up to nineteen days.
        echo "Expect OK once the datapoints stop, because missing data is treated as not breaching." \
          >> "$GITHUB_STEP_SUMMARY"

    - name: Disarm
      if: inputs.action == 'disarm'
      env:
        ALARM: ${{ steps.config.outputs.alarm }}
      run: |
        set -euo pipefail
        aws cloudwatch delete-alarms --alarm-names "$ALARM"

        REMAINING="$(aws cloudwatch describe-alarms --alarm-names "$ALARM" \
                       --query 'length(MetricAlarms)' --output text)"
        if [[ "$REMAINING" != "0" ]]; then
          echo "::error title=Still there::delete-alarms returned success but the alarm remains"
          exit 1
        fi

        {
          echo "### Deleted \`${ALARM}\`"
          echo ""
          echo "Now re-read the ticket. Deleting an alarm with an open ticket against it is routine"
          echo "rather than exceptional -- every release deletes the previous release's alarm, which"
          echo "may still have a ticket open -- so whether the delete releases the ticketing"
          echo "system's hold on it decides whether an oncall can ever close one."
        } >> "$GITHUB_STEP_SUMMARY"
