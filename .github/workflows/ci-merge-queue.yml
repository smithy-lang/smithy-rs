# This workflow runs CI for the GitHub merge queue.
#
# The queue tests each pull request on top of `main` and every pull request ahead of it, then
# fast-forwards `main` to the tested commit. It waits for every status check that the `main`
# ruleset requires, and a check that is never reported on the merge group holds the queue until
# its status check timeout. Every required check must therefore come from a job in this workflow.
# The jobs mirror `ci-pr.yml`, without the PR bot.
#
# Merge queue setup and the admin bypass for urgent merges are described in
# design/src/contributing/merge_queue.md.

name: Merge Queue CI
on:
  merge_group:
    types: [checks_requested]

# Each merge group has its own ref, so this only cancels a run that was started again for the same
# merge group, for example by a re-run.
concurrency:
  group: ci-merge-queue-yml-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: read

jobs:
  # This job will, if possible, save a docker login password to the job outputs. The token will
  # be encrypted with the passphrase stored as a GitHub secret. The login password expires after 12h.
  # The login password is encrypted with the repo secret DOCKER_LOGIN_TOKEN_PASSPHRASE
  save-docker-login-token:
    name: Save a docker login token
    timeout-minutes: 10
    outputs:
      docker-login-password: ${{ steps.set-token.outputs.docker-login-password }}
    permissions:
      id-token: write
      contents: read
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
    - name: Attempt to load a docker login password
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.SMITHY_RS_ECR_PUSH_ROLE_ARN }}
        role-session-name: GitHubActions
        aws-region: us-west-2
    - name: Save the docker login password to the output
      id: set-token
      run: |
        ENCRYPTED_PAYLOAD=$(
          gpg --symmetric --batch --passphrase "${{ secrets.DOCKER_LOGIN_TOKEN_PASSPHRASE }}" --output - <(aws ecr get-login-password --region us-west-2) | base64 -w0
        )
        echo "docker-login-password=$ENCRYPTED_PAYLOAD" >> $GITHUB_OUTPUT

  # This job detects if the merge group changes build tools. If it does, then it builds a new
  # build Docker image. Otherwise, it downloads a build image from ECR. In both cases,
  # it uploads the image as a build artifact for other jobs to download and use.
  acquire-base-image:
    name: Acquire Base Image
    timeout-minutes: 90
    needs: save-docker-login-token
    runs-on: smithy_ubuntu-latest_8-core
    env:
      ENCRYPTED_DOCKER_PASSWORD: ${{ needs.save-docker-login-token.outputs.docker-login-password }}
      DOCKER_LOGIN_TOKEN_PASSPHRASE: ${{ secrets.DOCKER_LOGIN_TOKEN_PASSPHRASE }}
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        path: smithy-rs
    - uses: ./smithy-rs/.github/actions/free-disk-space
    - name: Acquire base image
      id: acquire
      env:
        DOCKER_BUILDKIT: 1
      run: ./smithy-rs/.github/scripts/acquire-build-image
    - name: Acquire credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.SMITHY_RS_ECR_PUSH_ROLE_ARN }}
        role-session-name: GitHubActions
        aws-region: us-west-2
    - name: Upload image
      run: |
        IMAGE_TAG="ci-$(./smithy-rs/.github/scripts/docker-image-hash)"
        ./smithy-rs/.github/scripts/upload-build-image.sh $IMAGE_TAG

  # Run shared CI after the Docker build image has either been rebuilt or found in ECR
  ci:
    needs:
    - save-docker-login-token
    - acquire-base-image
    uses: ./.github/workflows/ci.yml
    secrets:
      ENCRYPTED_DOCKER_PASSWORD: ${{ needs.save-docker-login-token.outputs.docker-login-password }}
      DOCKER_LOGIN_TOKEN_PASSPHRASE: ${{ secrets.DOCKER_LOGIN_TOKEN_PASSPHRASE }}
      CANARY_GITHUB_ACTIONS_ROLE_ARN: ${{ secrets.CANARY_GITHUB_ACTIONS_ROLE_ARN }}
      CANARY_STACK_CDK_OUTPUTS_BUCKET_NAME: ${{ secrets.CANARY_STACK_CDK_OUTPUTS_BUCKET_NAME }}

  # `Check PR semver compliance` is a required check, so the queue needs it on the merge group too.
  # The merge group's head commit is this pull request's commit on top of `main` and every pull
  # request ahead of it in the queue. Comparing against that commit's parent checks only this pull
  # request's changes, as `ci-pr.yml` does, but on top of what will be on `main`. The `base_sha` in
  # the event payload isn't used because it has been reported to be the tip of `main` rather than
  # the parent, which would also judge the changes of pull requests ahead in the queue.
  semver-checks:
    name: Check PR semver compliance
    permissions:
      pull-requests: read
    runs-on: smithy_ubuntu-latest_8-core
    timeout-minutes: 30
    needs:
    - save-docker-login-token
    - acquire-base-image
    # We need `always` here otherwise this job won't run if the previous job has been skipped
    # See https://samanpavel.medium.com/github-actions-conditional-job-execution-e6aa363d2867
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
    - uses: actions/checkout@v4
      with:
        path: smithy-rs
        # Includes the parent of the merge group's head commit
        fetch-depth: 2
    - name: Find the merge group's parent commit
      id: parent
      working-directory: smithy-rs
      run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
    - name: Get PR info
      id: check-breaking-label
      uses: actions/github-script@v7
      with:
        script: |
          // The merge group's head ref is `refs/heads/gh-readonly-queue/<base>/pr-<number>-<parent sha>`.
          // Fail closed: without the pull request, its `breaking-change` label can't be checked.
          const headRef = context.payload.merge_group.head_ref;
          const match = /\/pr-(\d+)-[0-9a-f]+$/.exec(headRef);
          if (!match) {
            throw new Error(`Cannot find the pull request number in merge group ref ${headRef}`);
          }
          const pullNumber = Number(match[1]);
          const response = await github.rest.pulls.get({
            pull_number: pullNumber,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          const labels = response.data.labels.map(l => l.name);
          const isBreaking = labels.includes("breaking-change");
          // Same file filter as `ci-pr.yml`: skip the check when every changed file is inert
          // (docs, changelog, CI config), which can't affect any crate's API.
          //
          // Fail-open: any failure to enumerate the changed files (or an empty result) runs the
          // full semver check. A silent skip is a much worse outcome than a redundant run.
          let runSemver = true;
          try {
            const files = await github.paginate(github.rest.pulls.listFiles, {
              pull_number: pullNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            // Markdown only counts as inert outside the runtime crates: files under rust-runtime/
            // and aws/rust-runtime/ can be pulled into crate docs with `#[doc = include_str!(...)]`,
            // which is part of the public API surface `cargo-semver-checks` inspects.
            const inert = /^(design\/|docs\/|\.github\/|\.changelog\/|CHANGELOG\.md$|[^/]+\.md$)/;
            runSemver = files.length === 0 ? true : files.some(f => !inert.test(f.filename));
          } catch (e) {
            core.warning(`listFiles lookup failed, running semver checks anyway: ${e}`);
          }
          const data = {
            pullNumber,
            labels,
            isBreaking,
            runSemver
          };
          console.log("data:", data);
          return data;
    - name: Run semver check
      # Only run when the PR touches something that could change a crate's public API (see above)
      if: fromJSON(steps.check-breaking-label.outputs.result).runSemver
      env:
        ENCRYPTED_DOCKER_PASSWORD: ${{ needs.save-docker-login-token.outputs.docker-login-password }}
        DOCKER_LOGIN_TOKEN_PASSPHRASE: ${{ secrets.DOCKER_LOGIN_TOKEN_PASSPHRASE }}
      uses: ./smithy-rs/.github/actions/docker-build
      with:
        action: check-semver
        action-arguments: ${{ steps.parent.outputs.sha }} ${{ fromJSON(steps.check-breaking-label.outputs.result).isBreaking }}
    - name: Print help message
      if: failure()
      run: echo "::error::This pull request either contains breaking changes, or has cross-crate changes that may be backwards compatible, but that cargo-semver-checks cannot verify. Please scrutinize the change for backwards compatibility."
