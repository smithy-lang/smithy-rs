# This workflow runs CI for pull requests from forks, which can't make use of secrets.

name: CI (from fork)
on:
  pull_request:

# Allow one instance of this workflow per pull request, and cancel older runs when new changes are pushed
concurrency:
  group: ci-forks-yaml-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: read

jobs:
  # Forks do not have access to private ECR repository. Image is built locally
  # and uploaded as a build artifact for other jobs to download and use.
  acquire-base-image:
    name: Acquire Base Image
    if: ${{ github.event.pull_request.head.repo.full_name != 'smithy-lang/smithy-rs' }}
    permissions:
      id-token: write
      contents: read
    runs-on: smithy_ubuntu-latest_8-core
    timeout-minutes: 90
    steps:
    - uses: GitHubSecurityLab/actions-permissions/monitor@v1
    - uses: actions/checkout@v4
      with:
        path: smithy-rs
    - uses: ./smithy-rs/.github/actions/free-disk-space
    - name: Acquire base image
      id: acquire
      env:
        DOCKER_BUILDKIT: 1
      run: ./smithy-rs/.github/scripts/acquire-build-image
    - name: Upload base image
      uses: ./smithy-rs/.github/actions/upload-base-image

  # Run shared CI after the Docker build image has been built locally
  ci:
    needs: acquire-base-image
    if: ${{ github.event.pull_request.head.repo.full_name != 'smithy-lang/smithy-rs' }}
    uses: ./.github/workflows/ci.yml
    with:
      run_canary: false

  # Workflows executed directly in personal fork repositories cannot access
  # smithy-lang's self-hosted runners. Run this focused check on a GitHub-hosted
  # runner so contributors can validate the compatibility harness in their fork
  # before opening an upstream PR.
  check-released-codegen-runtime-compatibility-hosted:
    name: Check released codegen compatibility with current runtimes
    if: ${{ github.repository != 'smithy-lang/smithy-rs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: corretto
        java-version: 17
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.94.1
    - name: Run focused unit tests
      env:
        PYTHONPATH: tools/ci-scripts
      run: >-
        python3 -m unittest discover
        -s tools/ci-scripts/released_codegen_runtime_compatibility/tests -v
    - name: Run codegen/runtime compatibility check
      env:
        CODEGEN_RUNTIME_LOG_LEVEL: DEBUG
      run: ./tools/ci-scripts/released-codegen-runtime-compatibility.py

  semver-checks:
    name: Check PR semver compliance
    permissions:
      pull-requests: read
    runs-on: smithy_ubuntu-latest_8-core
    timeout-minutes: 30
    needs:
    - acquire-base-image
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.event.pull_request.head.repo.full_name != 'smithy-lang/smithy-rs'
    steps:
    - uses: GitHubSecurityLab/actions-permissions/monitor@v1
    - uses: actions/checkout@v4
      with:
        path: smithy-rs
        ref: ${{ inputs.git_ref }}
    - name: Get PR info
      id: check-breaking-label
      uses: actions/github-script@v7
      with:
        script: |
          const response = await github.rest.pulls.get({
            pull_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          const labels = response.data.labels.map(l => l.name);
          const isBreaking = labels.includes("breaking-change");
          const data = {
            labels,
            isBreaking
          };
          console.log("data:", data);
          return data;
    - name: Run semver check
      uses: ./smithy-rs/.github/actions/docker-build
      with:
        action: check-semver
        action-arguments: ${{ github.event.pull_request.base.sha }} ${{ fromJSON(steps.check-breaking-label.outputs.result).isBreaking }}
    - name: Print help message
      if: failure()
      run: echo "::error::This pull request either contains breaking changes, or has cross-crate changes that may be backwards compatible, but that cargo-semver-checks cannot verify. Please scrutinize the change for backwards compatibility."
