# This is the shared CI workflow that is run by both `ci-pr.yml` and `ci-main.yml` depending
# on if a pull request is being checked, or if the `main` branch is being checked after merge.

name: Test

on:
  workflow_call:
    inputs:
      run_canary:
        description: Whether to run the canary or not.
        required: false
        default: true
        type: boolean
      git_ref:
        description: |
          The git reference that all checks should be run against. It can be a branch, a tag or a commit SHA.
          If unspecified, it will default to the git reference or SHA that triggered the execution of this workflow.
        required: false
        type: string
        default: ''
    secrets:
      # the docker login password for ECR (encrypted with the DOCKER_LOGIN_TOKEN_PASSPHRASE)
      ENCRYPTED_DOCKER_PASSWORD:
        required: false
      DOCKER_LOGIN_TOKEN_PASSPHRASE:
        required: false
      CANARY_GITHUB_ACTIONS_ROLE_ARN:
        required: false
      CANARY_STACK_CDK_OUTPUTS_BUCKET_NAME:
        required: false

env:
  rust_version: 1.94.1
  rust_toolchain_components: clippy,rustfmt
  ENCRYPTED_DOCKER_PASSWORD: ${{ secrets.ENCRYPTED_DOCKER_PASSWORD }}
  DOCKER_LOGIN_TOKEN_PASSPHRASE: ${{ secrets.DOCKER_LOGIN_TOKEN_PASSPHRASE }}

jobs:
  # Lets the runtime-only jobs (Windows, exotic platforms) skip PRs that only touch docs/CI.
  # Outputs `rust=true` for any non-PR event or on error, so those always run the full checks.
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
    steps:
    - name: Detect Rust changes
      id: detect
      uses: actions/github-script@v7
      with:
        script: |
          if (context.eventName !== 'pull_request') {
            core.setOutput('rust', 'true');
            return;
          }
          // Runtime jobs only exercise the runtime crates, so skip when every changed file is inert
          // (docs, changelog, CI config, design). Default to running on any error.
          //
          // Markdown only counts as inert outside the runtime crates: files under rust-runtime/ and
          // aws/rust-runtime/ can be pulled into crate docs with `#[doc = include_str!(...)]`, so
          // editing them can break `cargo doc -D warnings` and must still run the checks.
          const inert = /^(design\/|docs\/|\.github\/|\.changelog\/|CHANGELOG\.md$|[^/]+\.md$)/;
          try {
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const rust = files.some(f => !inert.test(f.filename));
            core.setOutput('rust', rust ? 'true' : 'false');
          } catch (e) {
            core.warning(`change detection failed, running checks anyway: ${e}`);
            core.setOutput('rust', 'true');
          }

  # Generates the smoketest SDK and release bundle that most test-sdk legs need. The full SDK is
  # generated separately in `generate-full` so the smoketest-only legs don't wait on it.
  generate:
    name: Generate
    timeout-minutes: 30
    runs-on: smithy_ubuntu-latest_8-core
    # To avoid repeating setup boilerplate, we have the actual commands
    # in a matrix strategy. These commands get run in the steps after all the setup.
    strategy:
      fail-fast: false
      matrix:
        # These correspond to scripts in tools/ci-scripts that will be run in the Docker build image
        actions:
        - action: generate-aws-sdk-smoketest
        - action: generate-smithy-rs-release
    steps:
    - uses: GitHubSecurityLab/actions-permissions/monitor@v1
    - uses: actions/checkout@v4
      with:
        path: smithy-rs
        ref: ${{ inputs.git_ref }}
        # `generate-smithy-rs-release` requires access to previous tags to determine if a numerical suffix is needed
        # to make the release tag unique
        fetch-depth: 0
    # The models from aws-sdk-rust are needed to generate the full SDK for CI
    - uses: actions/checkout@v4
      with:
        repository: awslabs/aws-sdk-rust
        path: aws-sdk-rust
    - name: Run ${{ matrix.actions.action }}
      uses: ./smithy-rs/.github/actions/docker-build
      with:
        action: ${{ matrix.actions.action }}

  # Generates the full SDK, consumed only by the `test-sdk-full` legs and the canary. Kept off the
  # critical path so the smoketest-only legs don't wait on this slower generate.
  generate-full:
    name: Generate / full-sdk
    timeout-minutes: 30
    runs-on: smithy_ubuntu-latest_8-core
    steps:
    - uses: GitHubSecurityLab/actions-permissions/monitor@v1
    - uses: actions/checkout@v4
      with:
        path: smithy-rs
        ref: ${{ inputs.git_ref }}
    # The models from aws-sdk-rust are needed to generate the full SDK for CI
    - uses: actions/checkout@v4
      with:
        repository: awslabs/aws-sdk-rust
        path: aws-sdk-rust
    - name: Run generate-aws-sdk
      uses: ./smithy-rs/.github/actions/docker-build
      with:
        action: generate-aws-sdk

  # Test the code generator and other parts (styles and lints) that don't require
  # code to have already been generated in order to run.
  test-codegen:
    # `label || action` keeps matrix leg names readable instead of GitHub's auto-generated tuple
    name: Test Codegen / ${{ matrix.test.label || matrix.test.action }}
    runs-on: ${{ matrix.test.runner }}
    timeout-minutes: 35
    # To avoid repeating setup boilerplate, we have the actual test commands
    # in a matrix strategy. These commands get run in the steps after all the setup.
    strategy:
      fail-fast: false
      matrix:
        # These correspond to scripts in tools/ci-scripts that will be run in the Docker build image
        test:
        - action: check-aws-sdk-adhoc-tests
          runner: smithy_ubuntu-latest_8-core
        - action: check-client-codegen-integration-tests
          runner: smithy_ubuntu-latest_8-core
        - action: check-client-codegen-unit-tests
          runner: smithy_ubuntu-latest_8-core
        - action: check-core-codegen-unit-tests
          runner: smithy_ubuntu-latest_8-core
        # rust-runtime is split into workspace and additional legs; aws/rust-runtime stays one leg
        - action: check-rust-runtimes
          action-arguments: rust-runtime workspace
          label: check-rust-runtimes-smithy
          runner: smithy_ubuntu-latest_8-core
          fetch-depth: 0
        - action: check-rust-runtimes
          action-arguments: rust-runtime additional
          label: check-rust-runtimes-smithy-additional
          runner: smithy_ubuntu-latest_8-core
          fetch-depth: 0
        - action: check-rust-runtimes
          action-arguments: aws/rust-runtime
          label: check-rust-runtimes-aws
          runner: smithy_ubuntu-latest_8-core
          fetch-depth: 0
        - action: check-sdk-codegen-unit-tests
          runner: smithy_ubuntu-latest_8-core
        - action: check-fuzzgen
          runner: smithy_ubuntu-latest_8-core
        - action: check-server-codegen-integration-tests
          runner: smithy_ubuntu-latest_8-core
        - action: check-server-codegen-integration-tests-python
          runner: smithy_ubuntu-latest_8-core
        - action: check-server-codegen-unit-tests
          runner: smithy_ubuntu-latest_8-core
        - action: check-server-codegen-unit-tests-python
          runner: smithy_ubuntu-latest_8-core
        - action: check-serde-codegen-unit-tests
          runner: smithy_ubuntu-latest_8-core
        - action: check-server-e2e-test
          runner: smithy_ubuntu-latest_8-core
        - action: check-server-python-e2e-test
          runner: smithy_ubuntu-latest_8-core
        - action: check-style-and-lints
          runner: smithy_ubuntu-latest_8-core
        - action: check-book
          runner: smithy_ubuntu-latest_8-core
        - action: check-tools
          runner: smithy_ubuntu-latest_8-core
        - action: check-deterministic-codegen
          runner: smithy_ubuntu-latest_8-core
        - action: check-codegen-version
          runner: smithy_ubuntu-latest_8-core
        # Guards that the check-aws-config --partition legs cover the whole powerset (cheap; no SDK)
        - action: check-aws-config-partition-coverage
          runner: smithy_ubuntu-latest_8-core
    steps:
    - uses: GitHubSecurityLab/actions-permissions/monitor@v1
    - uses: actions/checkout@v4
      with:
        path: smithy-rs
        ref: ${{ inputs.git_ref }}
        # Defaults to 1 if not set
        fetch-depth: ${{ matrix.test.fetch-depth }}
    - name: Run ${{ matrix.test.action }}
      uses: ./smithy-rs/.github/actions/docker-build
      with:
        action: ${{ matrix.test.action }}
        action-arguments: ${{ matrix.test.action-arguments }}
        label: ${{ matrix.test.label }}

  # Separate from the main checks above because it uses aws-sdk-rust from GitHub
  check-semver-hazards:
    name: Check for semver hazards
    runs-on: smithy_ubuntu-latest_8-core
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        path: smithy-rs
        ref: ${{ inputs.git_ref }}
        fetch-depth: 0
    - uses: actions/checkout@v4
      with:
        repository: awslabs/aws-sdk-rust
        path: aws-sdk-rust
        fetch-depth: 0
    - name: Run check-semver-hazards
      uses: ./smithy-rs/.github/actions/docker-build
      with:
        action: check-semver-hazards

  # Test all the things that require generated code. Note: the Rust runtimes require codegen
  # to be checked since `aws-config` depends on the generated STS client.
  test-sdk:
    # `label || action` keeps matrix leg names readable instead of GitHub's auto-generated tuple
    name: Test the SDK / ${{ matrix.test.label || matrix.test.action }}
    needs: generate
    runs-on: ${{ matrix.test.runner }}
    # Defaults to 45 minutes; individual matrix entries can request more via
    # `timeout` so that one slow action doesn't loosen the guard for the others.
    timeout-minutes: ${{ matrix.test.timeout || 45 }}
    # To avoid repeating setup boilerplate, we have the actual test commands
    # in a matrix strategy. These commands get run in the steps after all the setup.
    strategy:
      fail-fast: false
      matrix:
        # These correspond to scripts in tools/ci-scripts that will be run in the Docker build image
        test:
        # check-aws-config split into a `base` leg + 4 `--partition` featureset legs
        - action: check-aws-config
          action-arguments: base
          label: check-aws-config-base
          runner: smithy_ubuntu-latest_8-core
        - action: check-aws-config
          action-arguments: featureset 1/4
          label: check-aws-config-featureset-1
          runner: smithy_ubuntu-latest_8-core
        - action: check-aws-config
          action-arguments: featureset 2/4
          label: check-aws-config-featureset-2
          runner: smithy_ubuntu-latest_8-core
        - action: check-aws-config
          action-arguments: featureset 3/4
          label: check-aws-config-featureset-3
          runner: smithy_ubuntu-latest_8-core
        - action: check-aws-config
          action-arguments: featureset 4/4
          label: check-aws-config-featureset-4
          runner: smithy_ubuntu-latest_8-core
          # This action runs `cargo hack` over aws-config's feature powerset, so
          # its runtime doubles with every feature added to the crate. Adding
          # `legacy-client` (#4755) took it from 80 to 160 feature combinations
          # and pushed it past the default 45 minutes: observed runs have
          # completed in ~43.5 minutes and been killed at the 45 minute cap.
          timeout: 60
        - action: check-aws-sdk-canary
          runner: smithy_ubuntu-latest_8-core
        # Split into docs and types legs; they use different toolchains, so no extra compilation
        - action: check-aws-sdk-smoketest-docs-clippy-udeps
          action-arguments: docs
          label: check-aws-sdk-smoketest-docs
          runner: smithy_ubuntu-latest_16-core
        - action: check-aws-sdk-smoketest-docs-clippy-udeps
          action-arguments: types
          label: check-aws-sdk-smoketest-types
          runner: smithy_ubuntu-latest_16-core
        - action: check-aws-sdk-smoketest-unit-tests
          runner: smithy_ubuntu-latest_8-core
        - action: check-aws-sdk-standalone-integration-tests
          runner: smithy_ubuntu-latest_8-core
        - action: check-aws-sdk-benchmarks
          runner: smithy_ubuntu-latest_8-core
    steps:
    - uses: GitHubSecurityLab/actions-permissions/monitor@v1
    - uses: actions/checkout@v4
      with:
        path: smithy-rs
        ref: ${{ inputs.git_ref }}
    - name: Run ${{ matrix.test.action }}
      uses: ./smithy-rs/.github/actions/docker-build
      with:
        action: ${{ matrix.test.action }}
        action-arguments: ${{ matrix.test.action-arguments }}
        label: ${{ matrix.test.label }}

  # The SDK checks that need the full SDK, split out so they wait on `generate-full` while the
  # smoketest-only legs above start after the faster `generate`.
  test-sdk-full:
    name: Test the SDK / ${{ matrix.test.label || matrix.test.action }}
    needs: generate-full
    runs-on: ${{ matrix.test.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        test:
        # check-only-aws-sdk-services sharded across 3 parallel legs
        - action: check-only-aws-sdk-services
          action-arguments: 1/3
          label: check-only-aws-sdk-services-1
          runner: smithy_ubuntu-latest_8-core
        - action: check-only-aws-sdk-services
          action-arguments: 2/3
          label: check-only-aws-sdk-services-2
          runner: smithy_ubuntu-latest_8-core
        - action: check-only-aws-sdk-services
          action-arguments: 3/3
          label: check-only-aws-sdk-services-3
          runner: smithy_ubuntu-latest_8-core
        - action: check-aws-sdk-cargo-deny
          runner: smithy_ubuntu-latest_8-core
    steps:
    - uses: GitHubSecurityLab/actions-permissions/monitor@v1
    - uses: actions/checkout@v4
      with:
        path: smithy-rs
        ref: ${{ inputs.git_ref }}
    - name: Run ${{ matrix.test.action }}
      uses: ./smithy-rs/.github/actions/docker-build
      with:
        action: ${{ matrix.test.action }}
        action-arguments: ${{ matrix.test.action-arguments }}
        label: ${{ matrix.test.label }}

  test-with-serde:
    name: Test the SDK with `serde` feature enabled.
    needs: generate
    runs-on: ${{ matrix.test.runner }}
    env:
      RUSTFLAGS: --cfg aws_sdk_unstable
      CARGO_FEATURE_SERDE_SERIALIZE: true
      CARGO_FEATURE_SERDE_DESERIALIZE: true
    # To avoid repeating setup boilerplate, we have the actual test commands
    # in a matrix strategy. These commands get run in the steps after all the setup.
    strategy:
      fail-fast: false
      matrix:
        # These correspond to scripts in tools/ci-scripts that will be run in the Docker build image
        test:
        - action: check-aws-config
          runner: smithy_ubuntu-latest_8-core
        - action: check-aws-sdk-canary
          runner: ubuntu-latest
        - action: check-aws-sdk-cargo-deny
          runner: ubuntu-latest
        - action: check-only-aws-sdk-services
          runner: smithy_ubuntu-latest_8-core
        - action: check-aws-sdk-smoketest-docs-clippy-udeps
          runner: smithy_ubuntu-latest_8-core
        - action: check-aws-sdk-smoketest-unit-tests
          runner: smithy_ubuntu-latest_8-core
        - action: check-aws-sdk-standalone-integration-tests
          runner: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        path: smithy-rs
        ref: ${{ inputs.git_ref }}
    - name: Run ${{ matrix.test.action }}
      uses: ./smithy-rs/.github/actions/docker-build
      with:
        action: ${{ matrix.test.action }}

  test-rust-windows:
    name: Rust Tests on Windows
    needs: detect-changes
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Disable incremental compilation to reduce disk space use
      CARGO_INCREMENTAL: 0
      RUSTDOCFLAGS: -D warnings
      RUSTFLAGS: -D warnings
      # A stable path for vcpkg's binary cache so the OpenSSL build can persist across runs
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.git_ref }}
      # Pinned to the commit hash of v2.7.3
    - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84
      if: needs.detect-changes.outputs.rust == 'true'
      with:
        shared-key: ${{ runner.os }}-${{ env.rust_version }}-${{ github.job }}
        workspaces: |
          .
          tools
    - uses: dtolnay/rust-toolchain@master
      if: needs.detect-changes.outputs.rust == 'true'
      with:
        toolchain: ${{ env.rust_version }}
        components: ${{ env.rust_toolchain_components }}
      # To fix OpenSSL not found on Windows: https://github.com/sfackler/rust-openssl/issues/1542
    # Cache the prebuilt OpenSSL so `vcpkg install` is a cache hit, not a ~6 min from-source build
    - name: Cache vcpkg OpenSSL
      if: needs.detect-changes.outputs.rust == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}\vcpkg-cache
        key: ${{ runner.os }}-vcpkg-openssl-x64-windows-static-md
    - if: needs.detect-changes.outputs.rust == 'true'
      run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
    - if: needs.detect-changes.outputs.rust == 'true'
      # vcpkg requires the binary cache directory to exist before it will write to it
      run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE
    - if: needs.detect-changes.outputs.rust == 'true'
      run: vcpkg install openssl:x64-windows-static-md
    - name: Run tests
      if: needs.detect-changes.outputs.rust == 'true'
      shell: bash
      run: tools/ci-scripts/test-windows.sh

  # aws-config is not part of the `aws/rust-runtime` workspace and depends on
  # generated SDK crates (STS, SSO, ...), so `test-rust-windows` (which tests the
  # runtime workspaces from a bare checkout) cannot cover it. This job supplies
  # the generated SDK from the `generate` job's smoketest artifact and runs the
  # aws-config tests natively on Windows. It runs in parallel with the other
  # jobs that depend on `generate` (e.g. `test-sdk`).
  test-rust-windows-aws-config:
    name: aws-config Tests on Windows
    needs: generate
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Disable incremental compilation to reduce disk space use
      CARGO_INCREMENTAL: 0
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.git_ref }}
      # Pinned to the commit hash of v2.7.3
    - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84
      with:
        shared-key: ${{ runner.os }}-${{ env.rust_version }}-${{ github.job }}
        workspaces: aws/rust-runtime/aws-config
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.rust_version }}
        components: ${{ env.rust_toolchain_components }}
    # aws-config builds against the generated SDK produced by the `generate` job.
    # We can't use the Linux Docker build image here, so download the smoketest
    # SDK artifact directly and place it where aws-config's path dependencies
    # expect it (mirrors the `mv` in the Linux `check-aws-config` script).
    - name: Download generated SDK (smoketest) artifact
      uses: actions/download-artifact@v4
      with:
        name: artifacts-generate-aws-sdk-smoketest
        path: artifacts-generate-aws-sdk-smoketest
    - name: Extract generated SDK to aws/sdk/build/aws-sdk
      shell: bash
      run: |
        tar xfz artifacts-generate-aws-sdk-smoketest/artifacts-generate-aws-sdk-smoketest.tar.gz
        mkdir -p aws/sdk/build
        mv aws-sdk-smoketest aws/sdk/build/aws-sdk
    - name: Run aws-config tests
      shell: bash
      run: tools/ci-scripts/test-windows-aws-config.sh

  # We make sure that smithy-rs can be compiled on platforms that are not
  # natively supported by GitHub actions. We run as many tests as we can on
  # those platforms, but not all of them, because they require a more
  # complicated setup involving architecture emulation.
  test-exotic-platform-support:
    name: Exotic platform support
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CROSS_CONFIG: Cross.toml
    strategy:
      fail-fast: false
      # We always exclude `aws-smithy-http-server-python`, `aws-smithy-http-server-typescript`, and `aws-smithy-experimental` since they are experimental.
      # We exclude `aws-smithy-http-client` due to FIPS related feature flags and aws-lc-fips target support
      # We exclude `aws-smithy-wasm` because it is only meant to build for WASM targets
      matrix:
        include:
        - target: i686-unknown-linux-gnu
          build_smithy_rs_features: --all-features
          build_aws_exclude: ''
          build_smithy_rs_exclude: --exclude aws-smithy-http-server-python --exclude aws-smithy-http-server-typescript --exclude aws-smithy-experimental --exclude aws-smithy-http-client --exclude aws-smithy-wasm
          test_smithy_rs_features: --all-features
          test_aws_features: --all-features
          test_aws_exclude: ''
          test_smithy_rs_exclude: --exclude aws-smithy-http-server-python --exclude aws-smithy-http-server-typescript --exclude aws-smithy-experimental --exclude aws-smithy-http-client  --exclude aws-smithy-wasm
        - target: powerpc-unknown-linux-gnu
          build_smithy_rs_features: ''
          build_aws_exclude: --exclude aws-inlineable
          build_smithy_rs_exclude: --exclude aws-smithy-http-server-python --exclude aws-smithy-http-server-typescript --exclude aws-smithy-experimental --exclude aws-smithy-http-client --exclude aws-smithy-http-server-metrics --exclude aws-smithy-http-server-metrics-macro  --exclude aws-smithy-wasm
          test_smithy_rs_features: ''
          test_aws_features: ''
          test_aws_exclude: --exclude aws-inlineable
          test_smithy_rs_exclude: --exclude aws-smithy-http-server-python --exclude aws-smithy-http-server-typescript --exclude aws-smithy-experimental --exclude aws-smithy-http-client --exclude aws-smithy-http-server-metrics --exclude aws-smithy-http-server-metrics-macro  --exclude aws-smithy-wasm
        - target: powerpc64-unknown-linux-gnu
          build_smithy_rs_features: ''
          build_aws_exclude: --exclude aws-inlineable
          build_smithy_rs_exclude: --exclude aws-smithy-http-server-python --exclude aws-smithy-http-server-typescript --exclude aws-smithy-experimental --exclude aws-smithy-http-client  --exclude aws-smithy-wasm
          test_smithy_rs_features: ''
          test_aws_features: ''
          test_aws_exclude: --exclude aws-inlineable
          test_smithy_rs_exclude: --exclude aws-smithy-http-server-python --exclude aws-smithy-http-server-typescript --exclude aws-smithy-experimental --exclude aws-smithy-http-client  --exclude aws-smithy-wasm
    steps:
    - uses: GitHubSecurityLab/actions-permissions/monitor@v1
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.git_ref }}
      # Pinned to the commit hash of v2.7.3
    - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84
      if: needs.detect-changes.outputs.rust == 'true'
      with:
        shared-key: ${{ runner.os }}-${{ env.rust_version }}-${{ github.job }}-${{ matrix.target }}
        workspaces: |
          .
          tools
    - uses: dtolnay/rust-toolchain@master
      if: needs.detect-changes.outputs.rust == 'true'
      with:
        toolchain: ${{ env.rust_version }}
        components: ${{ env.rust_toolchain_components }}
        targets: ${{ matrix.target }}
    - name: Sets OpenSSL env vars on i686
      run: |
        echo "OPENSSL_LIB_DIR=/usr/lib/i386-linux-gnu" >> $GITHUB_ENV
        echo "OPENSSL_INCLUDE_DIR=/usr/include/i386-linux-gnu" >> $GITHUB_ENV
      if: needs.detect-changes.outputs.rust == 'true' && matrix.target == 'i686-unknown-linux-gnu'
    - name: Sets OpenSSL env vars on ppc and ppc64
      run: |
        echo "OPENSSL_DIR=/openssl" >> $GITHUB_ENV
      if: needs.detect-changes.outputs.rust == 'true' && matrix.target != 'i686-unknown-linux-gnu'
    - name: Configure cross
      shell: bash
      if: needs.detect-changes.outputs.rust == 'true'
      # configure and cross compile openssl locally on ppc and ppc64 to be able to run aws-smithy-client tests.
      # since cross dropped support for openssl, we use the build script from version 0.16.
      run: |
        cargo install cross --locked --version 0.2.4

        cat > Cross.toml << EOF
        [target.i686-unknown-linux-gnu]
        pre-build = ["dpkg --add-architecture i386", "apt-get update && apt-get install --assume-yes pkg-config:i386 libssl-dev:i386"]
        [target.i686-unknown-linux-gnu.env]
        passthrough = [
            "OPENSSL_LIB_DIR",
            "OPENSSL_INCLUDE_DIR",
        ]
        [target.powerpc-unknown-linux-gnu]
        pre-build = ["curl -L -s https://github.com/cross-rs/cross/raw/c183ee37a9dc6b0e6b6a6ac9c918173137bad4ef/docker/openssl.sh | sed 's/curl https/curl -L https/' > /tmp/openssl.sh && bash /tmp/openssl.sh linux-ppc powerpc-linux-gnu-"]
        [target.powerpc-unknown-linux-gnu.env]
        passthrough = ["OPENSSL_DIR"]
        [target.powerpc64-unknown-linux-gnu]
        pre-build = ["curl -L -s https://github.com/cross-rs/cross/raw/c183ee37a9dc6b0e6b6a6ac9c918173137bad4ef/docker/openssl.sh | sed 's/curl https/curl -L https/' > /tmp/openssl.sh && bash /tmp/openssl.sh linux-ppc64 powerpc64-linux-gnu-"]
        [target.powerpc64-unknown-linux-gnu.env]
        passthrough = ["OPENSSL_DIR"]
        EOF
    - name: Build Smithy-rs rust-runtime crates
      if: needs.detect-changes.outputs.rust == 'true'
      shell: bash
      run: cross build -vv --target ${{ matrix.target }} --manifest-path "rust-runtime/Cargo.toml" ${{ matrix.build_smithy_rs_exclude }} --workspace ${{ matrix.build_smithy_rs_features }}
    - name: Build AWS rust-runtime crates
      if: needs.detect-changes.outputs.rust == 'true'
      shell: bash
      run: cross build -vv --target ${{ matrix.target }} --manifest-path "aws/rust-runtime/Cargo.toml" ${{ matrix.build_aws_exclude }} --workspace
    - name: Test Smithy-rs rust-runtime crates
      if: needs.detect-changes.outputs.rust == 'true'
      shell: bash
      run: cross test --target ${{ matrix.target }} --manifest-path "rust-runtime/Cargo.toml" ${{ matrix.test_smithy_rs_exclude }} --workspace ${{ matrix.test_smithy_rs_features }}
    - name: Test AWS rust-runtime crates
      if: needs.detect-changes.outputs.rust == 'true'
      shell: bash
      run: cross test --target ${{ matrix.target }} --manifest-path "aws/rust-runtime/Cargo.toml" ${{ matrix.test_aws_exclude }} --workspace ${{ matrix.test_aws_features }}

  # Run the canary against generated SDKs
  #
  # In addition to Matrix Success, this job will also be required to pass for merge.
  # CI execution from forked repositories will skip this job, and when it does
  # this skipped job will report its status as "Success".
  # https://docs.github.com/en/actions/using-jobs/using-conditions-to-control-job-execution#overview
  canary:
    name: Canary
    if: ${{ inputs.run_canary }}
    needs: generate-full
    runs-on: smithy_ubuntu-latest_8-core
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      actions: read
      pull-requests: read
    steps:
    - uses: GitHubSecurityLab/actions-permissions/monitor@v1
    - uses: actions/checkout@v4
      with:
        path: smithy-rs
        ref: ${{ inputs.git_ref }}
    - name: Configure credentials
      id: creds
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: us-west-2
        role-to-assume: ${{ secrets.CANARY_GITHUB_ACTIONS_ROLE_ARN }}
        output-credentials: true
    - name: Run canary
      uses: ./smithy-rs/.github/actions/docker-build
      with:
        action: run-canary
        action-arguments: ${{ secrets.CANARY_STACK_CDK_OUTPUTS_BUCKET_NAME }} ${{ steps.creds.outputs.aws-access-key-id }} ${{ steps.creds.outputs.aws-secret-access-key }} ${{ steps.creds.outputs.aws-session-token }} x86_64

  canary-arm:
    name: Canary (aarch64)
    if: ${{ inputs.run_canary }}
    needs: generate-full
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        path: smithy-rs
        ref: ${{ inputs.git_ref }}
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: artifacts-generate-aws-sdk
        path: artifacts-generate-aws-sdk
    - name: Extract artifacts
      run: tar xfz artifacts-generate-aws-sdk/artifacts-generate-aws-sdk.tar.gz
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-unknown-linux-musl
    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y musl-tools cmake perl clang pkg-config
    - name: Configure credentials
      id: creds
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.CANARY_GITHUB_ACTIONS_ROLE_ARN }}
        role-session-name: GitHubActions
        aws-region: us-west-2
        output-credentials: true
    - name: Run canary
      run: |
        export RUST_STABLE_VERSION="$(rustc --version | cut -d' ' -f2)"
        # Install the pinned toolchain from rust-toolchain.toml and add musl target
        rustup toolchain install 1.94.1
        rustup target add aarch64-unknown-linux-musl wasm32-wasip2 --toolchain 1.94.1
        ./smithy-rs/tools/ci-scripts/run-canary \
          ${{ secrets.CANARY_STACK_CDK_OUTPUTS_BUCKET_NAME }} \
          ${{ steps.creds.outputs.aws-access-key-id }} \
          ${{ steps.creds.outputs.aws-secret-access-key }} \
          ${{ steps.creds.outputs.aws-session-token }} \
          aarch64

  # This is always a failing job since forked repositories do not have necessary repository secrets
  # to run the PR bot workflow or the canary workflow
  ask-maintainer-to-run-pr-bot-and-canary:
    name: Ask maintainer to run the PR bot and canary workflows
    if: ${{ !inputs.run_canary }}
    runs-on: ubuntu-latest
    steps:
    - uses: GitHubSecurityLab/actions-permissions/monitor@v1
    - run: |
        echo "PR bot and canary cannot be invoked from a forked repository. Ask a maintainer to manually invoke them using your PR."
        exit 1

  # Pseudo-job that depends on matrix jobs so that we don't have to enter
  # the myriad of test matrix combinations into GitHub's protected branch rules
  require-all:
    needs:
    - detect-changes
    - generate
    - generate-full
    - test-codegen
    - test-sdk
    - test-sdk-full
    - test-rust-windows
    - test-rust-windows-aws-config
    - test-exotic-platform-support
    # Run this job even if its dependency jobs fail
    if: always()
    runs-on: ubuntu-latest
    name: Matrix Success
    steps:
    - uses: GitHubSecurityLab/actions-permissions/monitor@v1
    - name: Verify jobs succeeded
      # Pinned to commit hash of v1.2.2
      uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe
      with:
        jobs: ${{ toJSON(needs) }}
