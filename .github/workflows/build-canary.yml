#
# The post-publish build canary's legs.
#
# Each leg resolves a consumer-shaped manifest against crates.io, builds it, and runs the hermetic
# assertions, then reports one of five verdicts. Scenario x toolchain = one leg; every leg has its
# own lockfile and its own verdict.
#
# SCOPE. This workflow writes verdicts to the job log and nothing else:
#   - no `id-token: write`, no `role-to-assume`, no secrets
#   - no CloudWatch metric, no alarm, so nothing here can page anyone
# Reporting a verdict as a metric, and alarming on it, land separately and need an OIDC role this
# workflow does not have. Keeping those apart is deliberate: the whole matrix can be exercised, and
# its false-positive rate measured, before anything is able to wake an oncall.

name: Build canary
run-name: ${{ github.workflow }} - ${{ inputs.scenario }}

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Which tier dispatched this. Recorded on the run; does not change the legs.
        type: choice
        options: [manual, dispatch, floor]
        default: manual
      scenario:
        description: >
          Leg id, manifest name, or `all`. One scenario is one or two legs at a couple of minutes
          where `all` is 60 legs, which is why the filter exists rather than being a convenience.
        type: string
        default: all
      tag:
        description: >
          The release tag these legs were dispatched for. When set, a leg exits without building if a
          newer release-* tag exists -- a dispatched run outlives the cancellation of its dispatcher.
          Leave empty outside a release.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Keyed on the scenario so a release's concurrent manifests never cancel each other, while a
  # repeated dispatch of the same scenario supersedes its predecessor.
  group: build-canary-${{ inputs.scenario }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  matrix:
    name: Expand the matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      legs: ${{ steps.expand.outputs.legs }}
      count: ${{ steps.expand.outputs.count }}
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Expand
      id: expand
      working-directory: tools/ci-build/canary
      # Inputs come in through `env`, never interpolated into the script. `${{ }}` is substituted
      # into the command *text* before any shell sees it, so a value carrying a quote and `$(...)`
      # would execute on the runner. Dispatch inputs need write access today, but this workflow is
      # due to gain `id-token: write` and a role to assume, and at that point an injection here
      # reaches AWS.
      env:
        SCENARIO: ${{ inputs.scenario }}
      run: |
        set -euo pipefail

        # The span is clamped at the MSRV the crates under test declare, because a compiler below it
        # is not a supported configuration -- a failure there is a rust-version error, not a break.
        STABLE="$(rustc +stable --version | cut -d' ' -f2)"
        MSRV="$(grep '^rust.msrv=' "${GITHUB_WORKSPACE}/gradle.properties" | cut -d= -f2)"
        echo "stable=${STABLE}  msrv=${MSRV}"

        cargo run --quiet -- gen-matrix --stable "${STABLE}" --msrv "${MSRV}" > /tmp/all.json

        # Filter by leg id or manifest name. `all` keeps everything.
        python3 - "${SCENARIO}" <<'PY' > /tmp/legs.json
        import json, sys
        want = sys.argv[1]
        legs = json.load(open('/tmp/all.json'))
        if want != 'all':
            legs = [l for l in legs if want in (l['id'], l['manifest'])]
            if not legs:
                ids = sorted({l['id'] for l in json.load(open('/tmp/all.json'))})
                sys.exit(f"no leg or manifest matched {want!r}. available: {', '.join(ids)}")
        json.dump(legs, sys.stdout)
        PY

        echo "legs=$(cat /tmp/legs.json)" >> "$GITHUB_OUTPUT"
        echo "count=$(python3 -c 'import json;print(len(json.load(open("/tmp/legs.json"))))')" >> "$GITHUB_OUTPUT"

    - name: Summarise
      env:
        SCENARIO: ${{ inputs.scenario }}
        TIER: ${{ inputs.tier }}
        COUNT: ${{ steps.expand.outputs.count }}
        LEGS: ${{ steps.expand.outputs.legs }}
      run: |
        {
          echo "### Build canary matrix"
          echo ""
          echo "${COUNT} legs, tier \`${TIER}\`, scenario \`${SCENARIO}\`"
          echo ""
          echo "| leg | runner | target | toolchain | checks |"
          echo "|---|---|---|---|---|"
          printf '%s' "${LEGS}" | python3 -c "
        import json,sys
        for l in json.load(sys.stdin):
            print('| %s | %s | %s | %s | %s |' % (
                l['id'], l['runner'], l.get('target') or 'native',
                l['toolchain_version'], l['checks']))
        "
        } >> "$GITHUB_STEP_SUMMARY"

  leg:
    name: ${{ matrix.leg.id }}
    needs: matrix
    # Strictly under the watcher's 15-minute dispatch tick, so a leg can never outlive the tick that
    # dispatched it and be re-dispatched alongside itself. The leg tracks its own clock and emits
    # before this is reached -- a job killed here would run no further steps and so report nothing.
    timeout-minutes: 14
    runs-on: ${{ matrix.leg.runner }}
    strategy:
      # Every leg has its own verdict, so one red leg must not cancel the rest.
      fail-fast: false
      max-parallel: 20
      matrix:
        leg: ${{ fromJSON(needs.matrix.outputs.legs) }}
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install musl tools
      if: contains(matrix.leg.target, 'musl')
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Run the leg
      working-directory: tools/ci-build/canary
      shell: bash
      env:
        LEG_ID: ${{ matrix.leg.id }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        STABLE="$(rustc +stable --version | cut -d' ' -f2)"
        MSRV="$(grep '^rust.msrv=' "${GITHUB_WORKSPACE}/gradle.properties" | cut -d= -f2)"

        # Built as an array rather than interpolated, so an empty tag contributes no argument at all
        # and a non-empty one is a single argv entry whatever it contains.
        TAG_ARG=()
        if [[ -n "${RELEASE_TAG}" ]]; then
          TAG_ARG=(--tag "${RELEASE_TAG}")
        fi

        # Exits 0 for green or INFRA_FAIL, non-zero for any hard verdict. That is how a floor hour's
        # exit code carries the stop decision, since `needs:` can see success or failure but never why.
        cargo run --quiet -- run-leg \
          --leg "${LEG_ID}" \
          --stable "${STABLE}" \
          --msrv "${MSRV}" \
          --dir "${RUNNER_TEMP}/leg" \
          "${TAG_ARG[@]}" \
          | tee "${RUNNER_TEMP}/report.json"

    - name: Report the verdict
      id: report
      if: always()
      shell: bash
      env:
        LEG_ID: ${{ matrix.leg.id }}
      run: |
        set -uo pipefail
        REPORT="${RUNNER_TEMP}/report.json"
        # An absent report is the signature of a leg that died without saying anything, which is a
        # defect in the canary rather than a finding about the release. It stays a warning, and a
        # leg that skipped on purpose reports `stopped: superseded` rather than nothing, so this
        # does not fire on every leg of a superseded release and get tuned out.
        if [[ ! -s "$REPORT" ]]; then
          echo "::warning title=No report::the leg produced no report, which is itself a defect"
          exit 0
        fi
        python3 - "$REPORT" "$LEG_ID" <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import json, sys
        r = json.load(open(sys.argv[1]))
        verdict = r.get('verdict')
        if r.get('stopped') == 'superseded':
            print(f"### {sys.argv[2]} — SUPERSEDED")
            print()
            print("A newer `release-*` tag exists, so this leg did not build and reached no")
            print("verdict. It emits no datapoint.")
            raise SystemExit(0)
        print(f"### {sys.argv[2]} — {verdict or 'GREEN'}")
        print()
        if verdict:
            d = r.get('diagnosis') or {}
            print(f"- step: `{r.get('failed_step')}`")
            print(f"- stopped: `{r.get('stopped')}`")
            if d.get('codes'):
                print(f"- codes: {', '.join('`%s`' % c for c in d['codes'])}")
            if d.get('summary'):
                print(f"- {d['summary']}")
            if d.get('target'):
                at = f" at `{d['target_version']}`" if d.get('target_version') else ''
                print(f"- cargo target: `{d['target']}`{at}")
            # The versions, which is what a responder actually needs: a code and a message say
            # what the compiler objected to, not which published pair produced it.
            for dup in d.get('duplicate_versions') or []:
                versions = ' and '.join(f"`{v}`" for v in dup['versions'])
                print(f"- **two versions of `{dup['name']}` in one graph**: {versions}")
        print()
        print("| step | attempt | ok | verdict |")
        print("|---|---|---|---|")
        for a in r['attempts']:
            print("| `%s` | %d | %s | %s |" % (
                a['step'], a['attempt'], 'yes' if a['succeeded'] else 'no',
                a.get('verdict') or ''))
        PY

        # Whether there is anything to collect. A green leg and a superseded one have nothing to
        # explain; a leg that reached a verdict does. Read from the report rather than the leg's
        # exit code, which cannot tell green from INFRA_FAIL -- both exit 0 so the window continues.
        VERDICT="$(python3 -c "
        import json, sys
        r = json.load(open(sys.argv[1]))
        print('' if r.get('stopped') == 'superseded' else (r.get('verdict') or ''))
        " "$REPORT")"
        echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"

    # Only for a leg that reached a verdict. Without this the one artifact that says *what* broke is
    # discarded with RUNNER_TEMP when the job ends: a page would name `COMPILE_FAIL` and an error
    # code, and the exact set of published versions that produced it would be gone. Re-resolving
    # later gives a different graph, because crates.io has moved on -- which is the whole reason a
    # leg is a snapshot.
    - name: Collect the evidence
      if: always() && steps.report.outputs.verdict != ''
      shell: bash
      env:
        LEG_ID: ${{ matrix.leg.id }}
      run: |
        set -euo pipefail
        OUT="${RUNNER_TEMP}/evidence"
        mkdir -p "$OUT"
        cp "${RUNNER_TEMP}/report.json" "$OUT/"

        # The rendered crate *is* the reproduction recipe, and it is tiny. `target/` is not copied:
        # it is hundreds of megabytes of build output that says nothing the log does not.
        cd "${RUNNER_TEMP}/leg"
        cp Cargo.toml "$OUT/"
        # A resolve that never succeeded leaves no lockfile at all, so this is expected to be
        # missing for a RESOLVE_FAIL leg -- the evidence there is the manifest plus the step's
        # stderr in the job log.
        if [[ -f Cargo.lock ]]; then
          cp Cargo.lock "$OUT/"
        else
          echo "no Cargo.lock: the resolve never succeeded" > "$OUT/NO-LOCKFILE.txt"
        fi
        for dir in src tests; do
          [[ -d "$dir" ]] && cp -r "$dir" "$OUT/"
        done

        echo "collected $(du -sh "$OUT" | cut -f1) for ${LEG_ID}"
        find "$OUT" -type f | sed "s|$OUT/|  |"

    - name: Upload the evidence
      if: always() && steps.report.outputs.verdict != ''
      uses: actions/upload-artifact@v4
      with:
        name: evidence-${{ matrix.leg.id }}
        path: ${{ runner.temp }}/evidence
        # Long enough to investigate a release, short enough not to accumulate. The 24-hour window
        # plus a working week.
        retention-days: 14
        if-no-files-found: error
