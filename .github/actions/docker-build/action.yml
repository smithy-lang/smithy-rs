# Use this action to execute the action scripts in tools/ci-scripts.
name: smithy-rs Docker Build
description: Run Docker build command for smithy-rs
inputs:
  # The name of the script in tools/ci-scripts to run
  action:
    description: What action to run in the Docker build
    required: true
  action-arguments:
    description: Arguments to pass to the action
    required: false
  # Cache-safe slug for the artifact name and cache key (no slashes/spaces); defaults to `action`.
  # Set it when legs share an `action` but differ by `action-arguments`, so they don't collide.
  label:
    description: Unique slug for artifact name and cache key; defaults to action
    required: false
    default: ''
  use_cache:
    description: Whether to use the gradle cache
    type: boolean
    required: false
    default: true

runs:
  using: composite
  steps:
  - name: Gradle Cache
    if: ${{ github.event.inputs.use_cache == 'true' }}
    uses: actions/cache@v4
    with:
      path: |
        gradle/caches
        gradle/wrapper
      key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/caches/**/*', 'gradle/wrapper/**/*') }}
      restore-keys: |
        ${{ runner.os }}-gradle-
  # Cargo registry (index + downloaded crate sources) shared across containerized legs. ci-action
  # seeds this from the image's baked-in registry on a miss, so a cold cache never regresses.
  - name: Cargo registry cache
    uses: actions/cache@v4
    with:
      path: cargo-registry
      key: ${{ runner.os }}-cargo-registry-${{ hashFiles('smithy-rs/**/Cargo.lock') }}
      restore-keys: |
        ${{ runner.os }}-cargo-registry-
       # Pinned to the commit hash of v2.7.3
  - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84
    with:
      # Per-leg key: keying only on `github.job` made a job's matrix legs contend for one cache
      shared-key: ${{ runner.os }}-${{ github.job }}-${{ inputs.label != '' && inputs.label || inputs.action }}
      workspaces: |
        . smithy-rs-target
  - name: Download all artifacts
    uses: ./smithy-rs/.github/actions/download-all-artifacts
  - name: Prepare build image
    shell: bash
    run: |
      set -x
      ls -lsa
      docker image ls

      # Check the build artifacts to see if a prior step built a new Docker build image.
      # If smithy-rs-base-image was included in the downloaded build artifacts, then load
      # it and tag it as the base image to use for this action. This will prevent acquire-build-image
      # from attempting to download an image from ECR since it will already exist,
      # which enables testing build image modifications as part of the pull request.
      #
      # Test the tarball, not the directory. `download-artifact` creates the directory before it
      # writes anything and can then abort while still reporting success, so `-d` treated a failed
      # download as a hit and killed the job on `docker load`. Checking the file means an incomplete
      # download falls through to a remote pull below instead.
      if [[ -s smithy-rs-base-image/smithy-rs-base-image ]]; then
        echo "found base image in artifacts...loading it back into docker"
        IMAGE_TAG="ci-$(./smithy-rs/.github/scripts/docker-image-hash)"
        docker load -i smithy-rs-base-image/smithy-rs-base-image
        docker tag "smithy-rs-base-image:${IMAGE_TAG}" "smithy-rs-base-image:local"
      fi

      docker image ls

      # For this step, we want images to come from build artifacts (built as part a prior step),
      # or from ECR. We disable building the image from scratch so that any mistakes in the CI
      # configuration won't cause each individual action to build its own image, which would
      # drastically increase the total CI time. Fail fast!
      #
      # Fork runs are the exception. They can't authenticate to ECR and the GHCR mirror is private,
      # so the artifact above is their only source -- and if it didn't arrive there is nothing left
      # to fall back to, which is how a failed download took out every job that needs the image.
      # Allow those runs to rebuild instead. It is slow, but only reached on a cold runner whose
      # docker cache doesn't already hold the image, and it can't fail the way a missing source does.
      ALLOW_LOCAL_BUILD=${{ github.event.pull_request.head.repo.fork == true }} \
        ./smithy-rs/.github/scripts/acquire-build-image
     # This runs the commands from the matrix strategy
  - name: Run ${{ inputs.action }}
    shell: bash
    env:
      ARTIFACT_LABEL: ${{ inputs.label != '' && inputs.label || inputs.action }}
    run: |
      ./smithy-rs/tools/ci-build/ci-action ${{ inputs.action }} ${{ inputs.action-arguments}}
      tar cfz "artifacts-${ARTIFACT_LABEL}.tar.gz" -C artifacts .
  - name: Upload artifacts
    uses: actions/upload-artifact@v4
    with:
      name: artifacts-${{ inputs.label != '' && inputs.label || inputs.action }}
      path: artifacts-${{ inputs.label != '' && inputs.label || inputs.action }}.tar.gz
      if-no-files-found: error
      retention-days: 3
      overwrite: true
