# Benchmark harness for the schema-decoupled server error path (RFC §9 merge gate):
# legacy generated `IntoResponse<P>` vs schema-driven `ServerProtocol::serialize_error`,
# over the golden shapes from `wire-capture/tests/schema_serde_goldens.rs`.
#
# The generated server crates this depends on live in the gradle build output.
# Regenerate them with (run from the repo root, bash so JAVA_HOME is corretto21):
#
#   ./gradlew --rerun-tasks -P modules='json_rpc11,rpcv2Cbor,constraints,rest_json' \
#       :codegen-server-test:generateSmithyBuild :codegen-server-test:smithyBuild
#
# Then, from this directory:
#   cargo bench                    # criterion wall-time benches
#   cargo run --release --bin dhat_alloc   # dhat heap stats (allocs/bytes per serialize)
#
# CPU-counter benches (iai-callgrind) need valgrind, which does not run on
# Windows — run them under WSL2 or record criterion + dhat only (note it in the
# results doc, specs/bench-results-error-serde.md).
[package]
name = "schema-serde-bench"
version = "0.0.1"
edition = "2021"
publish = false

[workspace]

[dependencies]
json_rpc11 = { path = "../build/smithyprojections/codegen-server-test/json_rpc11/rust-server-codegen" }
rpcv2cbor = { path = "../build/smithyprojections/codegen-server-test/rpcv2Cbor/rust-server-codegen" }
constraints = { path = "../build/smithyprojections/codegen-server-test/constraints/rust-server-codegen" }
rest_json = { path = "../build/smithyprojections/codegen-server-test/rest_json/rust-server-codegen" }
aws-smithy-http-server = { path = "../../rust-runtime/aws-smithy-http-server", features = ["request-id"] }
http = "1"
http-body-util = "0.1.3"
bytes = "1"
tokio = { version = "1.23.1", features = ["macros", "rt"] }
dhat = "0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "error_serde"
harness = false

[profile.release]
debug = true # dhat backtraces

[profile.bench]
debug = true
