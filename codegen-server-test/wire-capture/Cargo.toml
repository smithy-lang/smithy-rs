# Wire-level capture harness for the schema-decoupled server RFC.
#
# - `tests/captures.rs`: captures for the assumptions register (B2/B3/B5/B6/C1/C2/C3/C6).
# - `tests/schema_serde_goldens.rs`: byte-identity goldens — legacy generated
#   `IntoResponse<P>` responses (unsuffixed, `schemaSerde` OFF crates) vs the
#   schema-driven serving path (`*-schema`, `schemaSerde` ON crates, whose
#   `IntoResponse<P>` delegates to `ServerProtocol::serialize_error`).
#
# The generated server crates this depends on live in the gradle build output.
# Regenerate them with (run from the repo root, bash so JAVA_HOME is corretto21):
#
#   ./gradlew --rerun-tasks -P modules='pokemon-service-server-sdk,pokemon-service-server-sdk-schema,json_rpc10,json_rpc10-schema,json_rpc11,json_rpc11-schema,rpcv2Cbor,rpcv2Cbor-schema,rpcv2Cbor_extras,constraints,constraints-schema,custom-validation-exception-example,rest_json,rest_json-schema' \
#       :codegen-server-test:generateSmithyBuild :codegen-server-test:smithyBuild
#
# Then: cargo test --manifest-path codegen-server-test/wire-capture/Cargo.toml -- --nocapture
[package]
name = "wire-capture"
version = "0.0.1"
edition = "2021"
publish = false

[workspace]

[dependencies]
json_rpc10 = { path = "../build/smithyprojections/codegen-server-test/json_rpc10/rust-server-codegen" }
json_rpc11 = { path = "../build/smithyprojections/codegen-server-test/json_rpc11/rust-server-codegen" }
rpcv2cbor = { path = "../build/smithyprojections/codegen-server-test/rpcv2Cbor/rust-server-codegen" }
rpcv2cbor_extras = { path = "../build/smithyprojections/codegen-server-test/rpcv2Cbor_extras/rust-server-codegen" }
constraints = { path = "../build/smithyprojections/codegen-server-test/constraints/rust-server-codegen" }
custom-validation-exception-example = { path = "../build/smithyprojections/codegen-server-test/custom-validation-exception-example/rust-server-codegen" }
rest_json = { path = "../build/smithyprojections/codegen-server-test/rest_json/rust-server-codegen" }
pokemon-service-server-sdk = { path = "../build/smithyprojections/codegen-server-test/pokemon-service-server-sdk/rust-server-codegen" }
json_rpc10-schema = { path = "../build/smithyprojections/codegen-server-test/json_rpc10-schema/rust-server-codegen" }
json_rpc11-schema = { path = "../build/smithyprojections/codegen-server-test/json_rpc11-schema/rust-server-codegen" }
rpcv2cbor-schema = { path = "../build/smithyprojections/codegen-server-test/rpcv2Cbor-schema/rust-server-codegen" }
constraints-schema = { path = "../build/smithyprojections/codegen-server-test/constraints-schema/rust-server-codegen" }
rest_json-schema = { path = "../build/smithyprojections/codegen-server-test/rest_json-schema/rust-server-codegen" }
pokemon-service-server-sdk-schema = { path = "../build/smithyprojections/codegen-server-test/pokemon-service-server-sdk-schema/rust-server-codegen" }
aws-smithy-http-server = { path = "../../rust-runtime/aws-smithy-http-server", features = ["request-id"] }
aws-smithy-schema = { path = "../../rust-runtime/aws-smithy-schema" }
http = "1"
http-body = "1"
http-body-util = "0.1.3"
bytes = "1"
tower = { version = "0.4", features = ["util"] }
tokio = { version = "1.23.1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
minicbor = { version = "2.2.1", features = ["alloc", "half"] }
hyper = "1"
