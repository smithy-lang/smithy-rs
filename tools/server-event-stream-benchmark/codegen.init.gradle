gradle.projectsEvaluated {
    ['server', 'client'].each { kind ->
        def p = gradle.rootProject.findProject(":codegen-${kind}")
        if (p == null) return
        def cli = p.configurations.create('eventStreamBenchmarkCli')
        def catalog = p.extensions.getByType(org.gradle.api.artifacts.VersionCatalogsExtension).named('libs')
        p.dependencies.add(cli.name, catalog.findLibrary('smithy-cli').get())
        p.tasks.register('generateEventStreamBenchmark', JavaExec) {
            classpath = p.sourceSets.main.runtimeClasspath + cli
            mainClass.set('software.amazon.smithy.cli.SmithyCli')
            args 'build', '--discover', '--config', System.getenv('EVENT_STREAM_BENCH_CONFIG'), '--output', System.getenv('EVENT_STREAM_BENCH_OUTPUT')
            maxHeapSize = '2g'
        }
    }
}
