[package]
name = "aws-smithy-dynamic-client"
version = "0.1.0"
publish = false
authors = ["AWS Rust SDK Team <aws-sdk-rust@amazon.com>"]
description = "Call Smithy services from a model loaded at runtime, without generated code."
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/smithy-lang/smithy-rs"
rust-version = "1.94.1"

[dependencies]
aws-smithy-cbor = { path = "../../rust-runtime/aws-smithy-cbor" }
aws-smithy-json = { path = "../../rust-runtime/aws-smithy-json" }
aws-smithy-lang = { path = "../../rust-runtime/aws-smithy-lang", features = ["runtime-schema"] }
aws-smithy-query = { path = "../../rust-runtime/aws-smithy-query" }
aws-smithy-runtime-api = { path = "../../rust-runtime/aws-smithy-runtime-api", features = ["client"] }
aws-smithy-schema = { path = "../../rust-runtime/aws-smithy-schema" }
aws-smithy-xml = { path = "../../rust-runtime/aws-smithy-xml" }

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]
# End of docs.rs metadata
