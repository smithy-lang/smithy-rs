[package]
name = "aws-smithy-dynamic-client"
version = "0.1.0"
publish = false
authors = ["AWS Rust SDK Team <aws-sdk-rust@amazon.com>"]
description = "Call Smithy services from a model loaded at runtime, without generated code."
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/smithy-lang/smithy-rs"
rust-version = "1.94.1"

[features]
default = ["aws", "default-https-client", "rt-tokio"]
# The AWS settings: region, credentials provider, and invocation ID generator. Also the SigV4 and
# SigV4a auth schemes.
# TODO(dynamic-client): Default to the AWS-LC crypto backend for SigV4 signing once
# https://github.com/smithy-lang/smithy-rs/pull/4874 merges. Keep a feature that selects the
# RustCrypto backend, so WebAssembly builds still work.
aws = ["dep:aws-credential-types", "dep:aws-runtime", "dep:aws-types", "aws-runtime/sigv4a"]
# The default HTTP client, used when the config sets none.
default-https-client = ["aws-smithy-runtime/default-https-client"]
# The Tokio sleep, used when the config sets no sleep implementation.
rt-tokio = ["aws-smithy-async/rt-tokio", "aws-smithy-runtime/rt-tokio"]

[dependencies]
aws-credential-types = { path = "../../aws/rust-runtime/aws-credential-types", optional = true }
aws-runtime = { path = "../../aws/rust-runtime/aws-runtime", optional = true }
aws-types = { path = "../../aws/rust-runtime/aws-types", optional = true }
aws-smithy-async = { path = "../../rust-runtime/aws-smithy-async" }
aws-smithy-dynamic-client-api = { path = "../aws-smithy-dynamic-client-api" }
aws-smithy-cbor = { path = "../../rust-runtime/aws-smithy-cbor" }
aws-smithy-json = { path = "../../rust-runtime/aws-smithy-json" }
aws-smithy-lang = { path = "../../rust-runtime/aws-smithy-lang", features = ["runtime-schema"] }
aws-smithy-query = { path = "../../rust-runtime/aws-smithy-query" }
aws-smithy-runtime = { path = "../../rust-runtime/aws-smithy-runtime", features = ["client", "http-auth"] }
aws-smithy-runtime-api = { path = "../../rust-runtime/aws-smithy-runtime-api", features = ["client", "http-auth"] }
aws-smithy-schema = { path = "../../rust-runtime/aws-smithy-schema" }
aws-smithy-types = { path = "../../rust-runtime/aws-smithy-types" }
aws-smithy-xml = { path = "../../rust-runtime/aws-smithy-xml" }
fastrand = "2.3.0"
tracing = "0.1.44"

[dev-dependencies]
aws-credential-types = { path = "../../aws/rust-runtime/aws-credential-types", features = ["test-util"] }
aws-smithy-async = { path = "../../rust-runtime/aws-smithy-async", features = ["test-util"] }
aws-smithy-http-client = { path = "../../rust-runtime/aws-smithy-http-client", features = ["test-util"] }
http-1x = { package = "http", version = "1.1.0" }
tokio = { version = "1.49.0", features = ["macros", "rt"] }

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]
# End of docs.rs metadata
