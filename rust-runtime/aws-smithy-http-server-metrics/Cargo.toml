[package]
name = "aws-smithy-http-server-metrics"
version = "0.5.0"
authors = [
    "AWS Rust SDK Team <aws-sdk-rust@amazon.com>",
    "Jason Gin <jasgin@amazon.com>",
]
description = "Server metrics via metrique integration."
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/smithy-lang/smithy-rs"
rust-version = "1.94.1"

[dependencies]
aws-smithy-schema = { path = "../aws-smithy-schema" }
aws-smithy-http-server = { path = "../aws-smithy-http-server", features = [
    "request-id",
] }
# Kept in lockstep with this crate's version so the macro and runtime crates are
# always released together; the macro generates code that references this crate's
# internals.
aws-smithy-http-server-metrics-macro = { path = "../aws-smithy-http-server-metrics-macro", version = "0.5.0" }
http = "1.3.1"
http-body = "1.0.1"
hyper = "1.6.0"
futures = "0.3"
metrique = "0.1.33"
metrique-core = "0.1.24"
metrique-util = { version = "0.1.9", features = ["metrics-pool"] }
metrique-writer = "0.1.29"
pin-project-lite = "0.2.14"
thiserror = "2"
tower = "0.4.13"
tracing = "0.1.44"

[dev-dependencies]
tracing-appender = "0.2"
metrique-writer-format-emf = "0.1.23"
metrique = { version = "0.1.33", features = ["test-util"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "time", "sync"] }
hyper-util = { version = "0.1.16", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
tower = "0.4.13"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]
# End of docs.rs metadata
