[package]
name = "aws-smithy-runtime"
version = "1.16.0"
authors = ["AWS Rust SDK Team <aws-sdk-rust@amazon.com>", "Zelda Hessler <zhessler@amazon.com>"]
description = "The new smithy runtime crate"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/smithy-lang/smithy-rs"
rust-version = "1.94.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# TODO(hyper1) - deprecate legacy hyper and http testing features when available in cargo: https://github.com/rust-lang/cargo/issues/7130
[features]
client = ["aws-smithy-runtime-api/client", "aws-smithy-types/http-body-1-x"]
http-auth = ["aws-smithy-runtime-api/http-auth"]
# Opt in to the pre-1.x `http`/`http-body` public API: `client::endpoint` and
# `client::http::body::minimum_throughput::http_body_0_4_x`. Not enabled by default so that
# http 0.2.x stays out of the default dependency tree.
http-02x = [
    "dep:http-02x",
    "dep:http-body-04x",
    "aws-smithy-types/http-body-0-4-x",
    # Chain to `aws-smithy-runtime-api`'s equivalent so that "I want the pre-1.x HTTP API" is a
    # single switch. Nothing in this crate's gated modules needs those conversions, but a consumer
    # of `aws-smithy-runtime` may not depend on `aws-smithy-runtime-api` directly and so would have
    # no way to enable them. Adds no crates: `dep:http-02x` above already pulls http 0.2.x in.
    "aws-smithy-runtime-api/http-02x",
]
# NOTE: connector-hyper-0-14-x and tls-rustls are "legacy" features related to default HTTP client based on hyper 0.14.x ecosystem
connector-hyper-0-14-x = ["dep:aws-smithy-http-client", "aws-smithy-http-client?/hyper-014", "aws-smithy-types/http-body-0-4-x"]
tls-rustls = ["dep:aws-smithy-http-client", "aws-smithy-http-client?/legacy-rustls-ring", "connector-hyper-0-14-x", "aws-smithy-runtime-api/legacy-client"]
default-https-client = ["dep:aws-smithy-http-client", "aws-smithy-http-client?/rustls-aws-lc"]
# Route the default HTTPS client's TLS through the FIPS 140-3 validated build of AWS-LC.
#
# This is the TLS arm of the top-level `aws-lc-fips` feature on generated SDK crates and on
# `aws-config`. Signing and checksums are reached by other routes: signing lives in the AWS
# layer (`aws-runtime` -> `aws-sigv4`), and `aws-smithy-checksums` isn't a dependency of this
# crate, so neither can be brokered from here.
#
# Named for the module it selects rather than `fips`, so that it does not read as a sibling of
# `Config::use_fips` on a generated SDK crate, which selects a FIPS-compliant *endpoint* and says
# nothing about which implementation performs the cryptography.
#
# The dependency reference is weak on purpose: this makes the TLS of an `aws-smithy-http-client`
# build FIPS, and does not install that client if a consumer chose a different one.
#
# It reaches the hyper 1.x rustls client only. Two other TLS paths are not covered:
# - The legacy `tls-rustls` feature, which is rustls 0.21 on `ring`. A `BehaviorVersion` older
#   than v2026_01_12 selects that client, so a FIPS build can end up with non-FIPS TLS; that
#   combination logs a warning from `client::defaults`.
# - `s2n-tls`, which is not reachable from this crate at all and has to be installed as an
#   explicit HTTP client. Note it is AWS-LC-based already: `s2n-tls`'s own `fips` feature is
#   `aws-lc-rs/fips`, the same validated module, so such a build can be FIPS -- but only if the
#   consumer enables that feature themselves, since `aws-smithy-http-client` does not forward it
#   (see the `TODO(hyper1)` note on its `s2n-tls` feature).
aws-lc-fips = ["aws-smithy-http-client?/rustls-aws-lc-fips"]
rt-tokio = ["tokio/rt"]

# Features for testing
# NOTE: `test-util` originally enabled the HTTP related test utils which have since been relocated to `aws-smithy-http-client`
# and updated to work with the 1.x HTTP/hyper ecosystem. Prefer using the `test-util` and `wire-mock` features from
# `aws-smithy-http-client` directly instead for HTTP test utils.
test-util = [
    "aws-smithy-runtime-api/test-util",
    "dep:tracing-subscriber",
    "aws-smithy-http-client/test-util",
]

legacy-test-util = [
    # A superset of `test-util`: the pre-1.x helpers are additive to the 1.x ones, and enabling
    # only this feature should still give you a usable test setup.
    "test-util",
    # legacy http test utils
    "connector-hyper-0-14-x",
    "aws-smithy-http-client/legacy-test-util",
    # `tests/stalled_stream_performance.rs` uses the http 0.2.x public API. This adds no new
    # http 0.2.x exposure: `connector-hyper-0-14-x` above already pulls it in transitively.
    "http-02x",
]

wire-mock = ["legacy-test-util", "aws-smithy-http-client/wire-mock"]

[dependencies]
aws-smithy-async = { path = "../aws-smithy-async" }
aws-smithy-http = { path = "../aws-smithy-http" }
aws-smithy-observability = { path = "../aws-smithy-observability" }
aws-smithy-runtime-api = { path = "../aws-smithy-runtime-api" }
aws-smithy-schema = { path = "../aws-smithy-schema" }
aws-smithy-types = { path = "../aws-smithy-types" }
aws-smithy-http-client = { path = "../aws-smithy-http-client", optional = true }
bytes = "1.11.1"
# Make sure to update `fastrand` in [dev-dependencies] if we bump the major version
# We probably need to update unit tests using the `fastrand` crate when that happens
fastrand = "2.3.0"
http-02x = { package = "http", version = "0.2.12", optional = true }
http-1x = { package = "http", version = "1.3.1" }
http-body-04x = { package = "http-body", version = "0.4.6", optional = true }
http-body-1x = { package = "http-body", version = "1.0.1" }
http-body-util = "0.1.3"
# This avoids bringing `httparse` 1.9.0 and 1.9.1 through `hyper-0-14` that break unit tests of runtime crates
#httparse = "1.8.0"
pin-project-lite = "0.2.14"
pin-utils = "0.1.0"
tokio = { version = "1.49.0", features = [] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", optional = true, features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
approx = "0.5.1"
aws-smithy-async = { path = "../aws-smithy-async", features = ["rt-tokio", "test-util"] }
aws-smithy-runtime-api = { path = "../aws-smithy-runtime-api", features = ["test-util"] }
aws-smithy-types = { path = "../aws-smithy-types", features = ["test-util"] }
# Allow only patch-level bumps since major-level or minor-level bumps can cause seed-value-breaking changes
# https://github.com/smol-rs/fastrand/issues/20
fastrand = "2.3.0"
futures-util = "0.3.29"
pretty_assertions = "1.4.0"
tokio = { version = "1.49.0", features = ["macros", "rt", "rt-multi-thread", "test-util", "full"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing-test = "0.2.1"
# FIXME - migrate to hyper-1
hyper_0_14 = { package = "hyper", version = "0.14.27", features = ["client", "server", "tcp", "http1", "http2"] }

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]
# End of docs.rs metadata

[package.metadata.smithy-rs-release-tooling]
stable = true

# aws-smithy-http is used by the http-auth feature, which is not turned on by the SDK at all.
# Without ignoring it, the `check-aws-sdk-smoketest-docs-clippy-udeps` CI script fails.
[package.metadata.cargo-udeps.ignore]
normal = ["aws-smithy-http"]
