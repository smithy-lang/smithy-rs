[package]
name = "aws-smithy-runtime-api"
version = "1.18.0"
authors = ["AWS Rust SDK Team <aws-sdk-rust@amazon.com>", "Zelda Hessler <zhessler@amazon.com>"]
description = "Smithy runtime types."
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/smithy-lang/smithy-rs"
rust-version = "1.94.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
client = []
http-auth = ["dep:zeroize"]
# Deprecated no-op, kept only for compatibility with already-released crates. It gated the
# pre-`v2026_01_12` behavior versions, which no longer need gating now that they fall back to the
# `hyper` 1.x client, so nothing in this repo enables or reads it.
#
# It cannot be deleted yet: `aws-sdk-rust`'s released `aws-smithy-runtime` still lists
# `aws-smithy-runtime-api/legacy-client` in its `tls-rustls`, and `check-semver-hazards` patches
# these crates into that release and resolves it, so removing the feature fails the build with
# "does not have that feature". `aws-smithy-runtime` here has already dropped the reference, so
# the next `aws-sdk-rust` release generated from this repo will not name it.
#
# Safe to delete once this prints nothing:
#     git -C aws-sdk-rust show <latest-release-tag>:sdk/aws-smithy-runtime/Cargo.toml | grep legacy-client
#
# Kept as `["client"]` rather than `[]` deliberately: `tls-rustls` never listed `client` itself, so
# this was the only thing giving `client` to a build that enabled `tls-rustls` alone. Emptying it
# would be a silent behavior change for those consumers.
legacy-client = ["client"]
test-util = ["aws-smithy-types/test-util", "http-1x"]
http-02x = ["dep:http-02x"]
http-1x = []

[dependencies]
aws-smithy-async = { path = "../aws-smithy-async" }
aws-smithy-runtime-api-macros = { path = "../aws-smithy-runtime-api-macros" }
aws-smithy-types = { path = "../aws-smithy-types", features = ["http-body-1-x"] }
bytes = "1.11.1"
http-02x = { package = "http", version = "0.2.12", optional = true }
http-1x = { package = "http", version = "1.3.1" }
pin-project-lite = "0.2.14"
tokio = { version = "1.49.0", features = ["sync"] }
tracing = "0.1.44"
zeroize = { version = "1.7.0", optional = true }

[dev-dependencies]
proptest = "1"
tokio = { version = "1.49.0", features = ["macros", "rt", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]
# End of docs.rs metadata

# make sure to keep crate stability in sync with the second element of the following tuple in
# buildSrc/src/main/kotlin/CrateSet.kt:
#  Crate("aws-smithy-runtime-api", STABLE_VERSION_PROP_NAME),
[package.metadata.smithy-rs-release-tooling]
stable = true
