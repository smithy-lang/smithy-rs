[package]
name = "aws-smithy-lang-fuzz"
version = "0.0.0"
authors = ["AWS Rust SDK Team <aws-sdk-rust@amazon.com>"]
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
aws-smithy-lang = { path = ".." }
# Version pinned due to https://github.com/rust-fuzz/libfuzzer/issues/126
libfuzzer-sys = "=0.4.7"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "idl_document"
path = "fuzz_targets/idl_document.rs"
test = false
doc = false

[[bin]]
name = "idl_node"
path = "fuzz_targets/idl_node.rs"
test = false
doc = false

[[bin]]
name = "idl_mixed"
path = "fuzz_targets/idl_mixed.rs"
test = false
doc = false
