[package]
name = "aws-smithy-checksums"
version = "0.66.0"
authors = [
    "AWS Rust SDK Team <aws-sdk-rust@amazon.com>",
    "Zelda Hessler <zhessler@amazon.com>",
]
description = "Checksum calculation and verification callbacks"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/smithy-lang/smithy-rs"
rust-version = "1.94.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["rustcrypto"]
# Use the RustCrypto crates (`md-5`, `sha1`, `sha2`) for SHA-1/SHA-256/MD5 digests. This is the
# default and is not FIPS-validated.
#
# Those crates are optional dependencies gated on this feature, so that a build which selects an
# AWS-LC backend and disables the default features does not compile them at all. Additive features
# cannot express "on unless AWS-LC is", so the only way to keep RustCrypto out of a FIPS build is to
# make enabling it a choice.
#
# This is a breaking change, which is why this crate goes to 0.66.0. `--no-default-features` used to
# be a no-op here -- the crate had no `[features]` section before this work -- and now loses the
# backend; the recovery is to name `rustcrypto`. `crypto.rs` emits a `compile_error!` naming the fix.
rustcrypto = ["dep:md-5", "dep:sha1", "dep:sha2"]
# Use aws-lc-rs for SHA-1/SHA-256 digests, backed by the non-FIPS AWS-LC build.
#
# Needs a C/C++ compiler, and works on every target aws-lc-rs supports. That is most of what
# the SDK supports, but not all of it: per
# https://aws.github.io/aws-lc-rs/platform_support.html the only WASM target aws-lc-rs supports
# is wasm32-unknown-emscripten, so `wasm32-unknown-unknown` and the WASI targets must stay on
# `rustcrypto`. This is the reason `rustcrypto` remains the default rather than this feature.
#
# Two details about the spelling below, both consequences of `default-features = false` on the
# dependency, which means the AWS-LC build has to be named explicitly:
# - `aws-lc-rs-fips` does not stack on this feature, so enabling `aws-lc-rs-fips` alone compiles
#   only `aws-lc-fips-sys`, not both AWS-LC builds. (rustls stacks its `fips` on its `aws_lc_rs`
#   feature and so always builds both.)
# - This names aws-lc-rs's `aws-lc-sys` feature rather than its `non-fips` feature, because
#   `non-fips` and `fips` are mutually exclusive there — aws-lc-rs fails its build if both are
#   on — and that would make this feature and `aws-lc-rs-fips` impossible to enable together,
#   something `--all-features` and feature unification across a workspace do routinely. With both
#   on, both AWS-LC builds compile and aws-lc-rs uses the FIPS one.
aws-lc-rs = ["__aws-lc-rs", "aws-lc-rs?/aws-lc-sys"]
# Use aws-lc-rs for SHA-1/SHA-256 digests, backed by the FIPS 140-3 validated AWS-LC build.
# Takes precedence over `aws-lc-rs` when both are enabled.
#
# Named for the backend it selects, as its `aws-lc-rs` sibling is, rather than `fips`: on a
# generated SDK crate a bare `fips` would sit next to `Config::use_fips`, which selects a
# FIPS-compliant *endpoint* and is unrelated to which module performs the cryptography.
#
# Supported on a subset of the targets above: x86_64 and aarch64 Linux (gnu and musl), `arm`
# musleabi/musleabihf, powerpc/powerpc64/powerpc64le gnu, macOS, 64-bit Windows MSVC, and x86_64
# FreeBSD. Not i686, not riscv64, not s390x, not mips, not NetBSD, not iOS, not Android, not WASM.
# The missing i686 support is why CI excludes this crate from its i686 `--all-features` leg.
# Requires a C/C++ compiler, CMake, and Go at build time, plus bindgen on targets without
# pre-generated FIPS bindings, which is everything except 64-bit Linux and macOS.
aws-lc-rs-fips = ["__aws-lc-rs", "aws-lc-rs?/fips"]
# Internal: selects the aws-lc-rs digest backend. Do not enable directly; use
# `aws-lc-rs` or `aws-lc-rs-fips` instead so that an AWS-LC build is also selected.
__aws-lc-rs = ["dep:aws-lc-rs"]

[dependencies]
aws-smithy-http = { path = "../aws-smithy-http" }
aws-smithy-types = { path = "../aws-smithy-types", features = ["http-body-1-x"]}
bytes = "1.11.1"
# FIXME(https://github.com/smithy-lang/smithy-rs/issues/3981): Keep pinned until we have more comprehensive testing in place
crc-fast = "1.9.0"
hex = "0.4.3"
http-1x = {package = "http", version = "1.3.1"}
http-body-1x = {package = "http-body", version = "1.0.1"}
http-body-util = "0.1.3"
pin-project-lite = "0.2.14"
tracing = "0.1.44"
# RustCrypto digest backend, used unless an AWS-LC arm is selected. Optional and gated on the
# `rustcrypto` feature, so that an AWS-LC build with `default-features = false` does not compile
# them.
md-5 = { version = "0.11", optional = true }
sha1 = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }
# aws-lc-rs digest backend; see the `aws-lc-rs` and `aws-lc-rs-fips` features.
# `default-features = false` so that the AWS-LC build (non-FIPS vs FIPS) is chosen
# explicitly by those features rather than defaulting to the non-FIPS one.
#
# The upper bound is the load-bearing half: `aws-lc-rs` 1.18 moved `aws-lc-fips-sys` to 0.14.x, which
# is AWS-LC-FIPS 4.1.0 — in process, not certificated — and a plain floor cannot keep a build off it,
# since Cargo takes the highest compatible version. `<1.18` holds the FIPS arm on `aws-lc-fips-sys`
# 0.13.x, which does hold certificates.
#
# The lower bound is an advisory bound, not an API one: the aws-lc-rs APIs used here compile against
# 1.16.1. It also must be present — a bare `<1.18` admits the featureless `aws-lc-rs` 0.0.1
# placeholder and breaks CI's `minimal-versions --direct` leg.
#
# This range must stay in step with `aws-sigv4`'s, because Cargo unifies on a single `aws-lc-rs`
# version graph-wide. See that crate's Cargo.toml for the advisory table, and for the rustls cost the
# upper bound carries.
aws-lc-rs = { version = ">=1.17.4, <1.18", optional = true, default-features = false }

[dev-dependencies]
bytes-utils = "0.1.2"
pretty_assertions = "1.3"
tokio = { version = "1.49.0", features = ["macros", "rt"] }
tracing-test = "0.2.1"

# These are the RustCrypto backend. Making them optional means a deliberate AWS-LC build
# (`--no-default-features` plus an AWS-LC arm) does not compile them at all, so there is nothing for
# udeps to flag there. This list is still required for one configuration: `--all-features`, which CI
# runs udeps under, enables `rustcrypto` *and* an AWS-LC arm, so the crates are present while the cfg
# routes around them. They are the live backend in a default build, so they are not dead
# dependencies -- only dead in that combination.
[package.metadata.cargo-udeps.ignore]
normal = ["md-5", "sha1", "sha2"]

[package.metadata.docs.rs]
# `all-features` is off because the `aws-lc-rs-fips` feature builds aws-lc-fips-sys, which can't
# build on docs.rs. `sdk-lints` grants this crate an exception for that reason.
all-features = false
features = ["rustcrypto", "aws-lc-rs"]
targets = ["x86_64-unknown-linux-gnu"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]
# End of docs.rs metadata
