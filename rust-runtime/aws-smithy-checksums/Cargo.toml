[package]
name = "aws-smithy-checksums"
version = "0.65.2"
authors = [
    "AWS Rust SDK Team <aws-sdk-rust@amazon.com>",
    "Zelda Hessler <zhessler@amazon.com>",
]
description = "Checksum calculation and verification callbacks"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/smithy-lang/smithy-rs"
rust-version = "1.94.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["rustcrypto"]
# RustCrypto backend (`md-5`, `sha1`, `sha2`): SHA-1/SHA-256/MD5. Default, not FIPS-validated.
# Those crates are optional and gated here, which is the only way to express their absence:
# features are additive, so "RustCrypto unless AWS-LC" is not expressible.
#
# This breaks `--no-default-features`, which was a no-op before this work -- the crate had no
# `[features]` section -- and now has no backend. `crypto.rs` emits a `compile_error!` naming the
# fix. It ships as a 0.65.x patch rather than 0.66.0 because Cargo treats a 0.x minor as
# incompatible: `aws-sdk-s3`'s published `aws-smithy-checksums = "0.65.1"` would reject 0.66.0, so
# `check-semver-hazards` would leave s3 on the registry copy and never test this change.
rustcrypto = ["dep:md-5", "dep:sha1", "dep:sha2"]
# aws-lc-rs backend on the non-FIPS AWS-LC build. See the crate docs for target support; the gap
# that keeps `rustcrypto` the default is WASM, where aws-lc-rs supports only emscripten.
#
# Names aws-lc-rs's `aws-lc-sys` rather than its `non-fips`, which is mutually exclusive with
# `fips` and would make the two arms impossible to enable together -- something `--all-features`
# does routinely. The arms are siblings rather than stacked, so a FIPS build compiles only the
# validated library.
aws-lc-rs = ["__aws-lc-rs", "aws-lc-rs?/aws-lc-sys"]
# aws-lc-rs backend on the FIPS 140-3 validated AWS-LC build. Takes precedence over `aws-lc-rs`.
#
# Named for the backend rather than `fips`, which on a generated SDK crate would sit next to
# `Config::use_fips`: that selects a FIPS-compliant *endpoint* and says nothing about which
# implementation does the cryptography. See the crate docs for target support and build tools.
aws-lc-rs-fips = ["__aws-lc-rs", "aws-lc-rs?/fips"]
# Internal: selects the aws-lc-rs backend without naming an AWS-LC build. Use `aws-lc-rs` or
# `aws-lc-rs-fips`.
__aws-lc-rs = ["dep:aws-lc-rs"]

[dependencies]
aws-smithy-http = { path = "../aws-smithy-http" }
aws-smithy-types = { path = "../aws-smithy-types", features = ["http-body-1-x"]}
bytes = "1.11.1"
# FIXME(https://github.com/smithy-lang/smithy-rs/issues/3981): Keep pinned until we have more comprehensive testing in place
crc-fast = "1.9.0"
hex = "0.4.3"
http-1x = {package = "http", version = "1.3.1"}
http-body-1x = {package = "http-body", version = "1.0.1"}
http-body-util = "0.1.3"
pin-project-lite = "0.2.14"
tracing = "0.1.44"
# RustCrypto digest backend, gated on `rustcrypto` so an AWS-LC build can leave it out.
md-5 = { version = "0.11", optional = true }
sha1 = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }
# aws-lc-rs digest backend; see the `aws-lc-rs` and `aws-lc-rs-fips` features.
# `default-features = false` so those features name the AWS-LC build rather than defaulting to the
# non-FIPS one.
#
# Keep the floor in step with `aws-sigv4`'s. Cargo resolves one `aws-lc-rs` 1.x for the whole
# graph, so they cannot drift apart at build time, but the declared requirements should still
# agree. See that crate's Cargo.toml for why this version.
aws-lc-rs = { version = "1.18.1", optional = true, default-features = false }

[dev-dependencies]
bytes-utils = "0.1.2"
pretty_assertions = "1.3"
tokio = { version = "1.49.0", features = ["macros", "rt"] }
tracing-test = "0.2.1"

# Needed only for `--all-features`, which CI runs udeps under: it enables `rustcrypto` *and* an
# AWS-LC arm, so these are compiled while the cfg routes around them. They are the live backend in
# a default build, and absent entirely from a `--no-default-features` AWS-LC build.
[package.metadata.cargo-udeps.ignore]
normal = ["md-5", "sha1", "sha2"]

[package.metadata.docs.rs]
# `all-features` would build aws-lc-fips-sys, which docs.rs cannot. `sdk-lints` exempts this crate.
all-features = false
features = ["rustcrypto", "aws-lc-rs"]
targets = ["x86_64-unknown-linux-gnu"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]
# End of docs.rs metadata
