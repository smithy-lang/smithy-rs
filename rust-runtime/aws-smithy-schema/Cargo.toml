[package]
name = "aws-smithy-schema"
version = "1.0.0"
authors = ["AWS Rust SDK Team <aws-sdk-rust@amazon.com>"]
description = "Schema types for the smithy-rs ecosystem"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/smithy-lang/smithy-rs"
rust-version = "1.94.1"

[features]
derive = ["dep:aws-smithy-schema-derive"]

[dependencies]
aws-smithy-runtime-api = { path = "../aws-smithy-runtime-api", features = ["client"] }
aws-smithy-schema-derive = { path = "../aws-smithy-schema-derive", optional = true }
aws-smithy-types = { path = "../aws-smithy-types", default-features = false }
http = "1.3.1"

[dev-dependencies]
# `http-1x` turns on `TryFrom<http::HeaderMap> for Headers`, the only way to build a
# `Headers` holding a value that is not valid UTF-8 — the normal string-like insert APIs
# cannot express one. This is a test-only feature flip: the feature gates cfgs, not an
# optional crate, so it adds no dependency to the published library.
aws-smithy-runtime-api = { path = "../aws-smithy-runtime-api", features = [
    "client",
    "http-1x",
] }
[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]
# End of docs.rs metadata

# make sure to keep crate stability in sync with the second element of the following tuple in
# buildSrc/src/main/kotlin/CrateSet.kt:
# Crate("aws-smithy-types", STABLE_VERSION_PROP_NAME),
[package.metadata.smithy-rs-release-tooling]
stable = true
