# Note: This workspace exists so that these tests can be run without having to build the entire SDK. When you run
# `./gradlew -Paws.fullsdk=true :aws:sdk:assemble` these tests are copied into their respective Service crates.
[workspace]
resolver = "2"
members = [
    "bedrockruntime",
    "cloudwatchlogs",
    "codecatalyst",
    "dynamodb",
    "ec2",
    "glacier",
    "iam",
    "kms",
    "lambda",
    "no-default-features",
    "polly",
    "s3",
    "s3control",
    "sqs",
    "sts",
    "telemetry",
    "timestreamquery",
    "transcribestreaming",
    "webassembly-no-os",
    "webassembly-wstd",
]
# Excluded rather than a member on purpose. This crate takes the SDK with default features, and
# `resolver = "2"` unifies features across members built together, which would switch
# `default-https-client` back on for `no-default-features` and defeat what it asserts.
exclude = [
    "no-http-02x",
]
