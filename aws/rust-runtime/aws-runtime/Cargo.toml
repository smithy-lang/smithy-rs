[package]
name = "aws-runtime"
version = "1.11.0"
authors = ["AWS Rust SDK Team <aws-sdk-rust@amazon.com>"]
description = "Runtime support code for the AWS SDK. This crate isn't intended to be used directly."
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/smithy-lang/smithy-rs"
rust-version = "1.94.1"

[features]
# This crate declares `aws-sigv4` with `default-features = false` so that a FIPS build can keep the
# RustCrypto crates out of the dependency graph entirely. That choice has to be forwarded from here,
# because Cargo gives a consumer no way to switch off a transitive crate's default features -- only
# the crate that declares the dependency can do that. Without this `default`, every consumer of this
# crate would get an `aws-sigv4` with no crypto backend.
#
# This crate had no `default` list before, so `default-features = false` on it was a no-op; it now
# drops the crypto backend, and such a build fails with the `compile_error!` in `aws-sigv4`'s
# `crypto` module naming the fix. That is a behaviour change shipping under a minor version, which
# is deliberate: a major here would be far more disruptive. `aws_runtime::invocation_id`'s
# `SharedInvocationIdGenerator` and `InvocationIdGenerator` are whitelisted in
# `aws/sdk/sdk-external-types.toml` as public surface of every generated SDK crate, and `aws-config`
# re-exports four `env_config` types in `profile.rs` and `profile/parser.rs`. Under a major, any
# application naming `aws-runtime = "1"` and exchanging one of those types with its SDK client would
# stop compiling on a version-identity mismatch, and staying consistent would mean major-bumping
# every `aws-sdk-*` crate. Trading that for a flag that previously did nothing is the better deal.
default = ["rustcrypto"]
# Forwards to `aws-sigv4`'s RustCrypto backend. Named here rather than inherited, for the reason
# above. A FIPS consumer disables the default features of their SDK crate, which drops this, and
# names `aws-lc-fips` instead.
rustcrypto = ["aws-sigv4/rustcrypto"]
event-stream = ["dep:aws-smithy-eventstream", "aws-sigv4/sign-eventstream"]
# `aws-smithy-types/http-body-0-4-x` gives `SdkBody: http_body_04x::Body`, which the
# `AwsChunkedBody` 0.4 impl needs. Previously inherited transitively from `aws-smithy-runtime`.
http-02x = ["dep:http-02x", "dep:http-body-04x", "aws-smithy-types/http-body-0-4-x"]
http-1x = []
test-util = ["dep:regex-lite"]
sigv4a = ["aws-sigv4/sigv4a"]
# Route SigV4/SigV4a signing through the FIPS 140-3 validated build of AWS-LC.
#
# This is the signing arm of the top-level `aws-lc-fips` feature on generated SDK crates and on
# `aws-config`; TLS and checksums are reached by other routes, since neither is a dependency
# of this crate. See `aws-sigv4`'s `aws-lc-rs-fips` feature for the platform requirements.
#
# Named for the module it selects rather than `fips`, so that it does not read as a sibling of
# `Config::use_fips` on a generated SDK crate, which selects a FIPS-compliant *endpoint* and says
# nothing about which implementation performs the cryptography.
aws-lc-fips = ["aws-sigv4/aws-lc-rs-fips"]

[dependencies]
aws-credential-types = { path = "../aws-credential-types" }
# `default-features = false` so that the crypto backend is chosen from here rather than inherited --
# see the `rustcrypto` feature above. The two non-backend defaults are named back explicitly:
# `sign-http` gates the `http_request` module this crate uses throughout `auth`, and `http1` gates
# its `http` 1.x support.
aws-sigv4 = { path = "../aws-sigv4", default-features = false, features = ["sign-http", "http1"] }
aws-smithy-async = { path = "../../../rust-runtime/aws-smithy-async" }
aws-smithy-eventstream = { path = "../../../rust-runtime/aws-smithy-eventstream", optional = true }
aws-smithy-http = { path = "../../../rust-runtime/aws-smithy-http" }
aws-smithy-runtime = { path = "../../../rust-runtime/aws-smithy-runtime", features = ["client" ] }
aws-smithy-runtime-api = { path = "../../../rust-runtime/aws-smithy-runtime-api", features = ["client", "http-1x"] }
aws-smithy-types = { path = "../../../rust-runtime/aws-smithy-types", features = ["http-body-1-x"]}
aws-types = { path = "../aws-types" }
bytes = "1.11.1"
bytes-utils = "0.1.2"
fastrand = "2.3.0"
http-02x = { package = "http", version = "0.2.12", optional = true}
http-body-04x = { package = "http-body", version = "0.4.6", optional = true}
http-1x = { package = "http", version = "1.3.1"}
http-body-1x = { package = "http-body", version = "1.0.1"}
percent-encoding = "2.3.1"
pin-project-lite = "0.2.14"
regex-lite = { version = "0.1.5", optional = true }
tracing = "0.1.44"
uuid = { version = "1" }

[dev-dependencies]
arbitrary = "1.3"
aws-credential-types = { path = "../aws-credential-types", features = ["test-util"] }
aws-smithy-async = { path = "../../../rust-runtime/aws-smithy-async", features = ["test-util"] }
aws-smithy-protocol-test = { path = "../../../rust-runtime/aws-smithy-protocol-test" }
aws-smithy-runtime-api = { path = "../../../rust-runtime/aws-smithy-runtime-api", features = ["test-util", "http-1x"] }
aws-smithy-types = { path = "../../../rust-runtime/aws-smithy-types", features = ["test-util"] }
bytes-utils = "0.1.2"
convert_case = "0.6.0"
futures-util = { version = "0.3.29", default-features = false }
http-body-util = "0.1.3"
proptest = "1.2"
serde = { version = "1", features = ["derive"]}
serde_json = "1"
tokio = { version = "1.49.0", features = ["macros", "rt", "time"] }
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
tracing-test = "0.2.4"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]
# End of docs.rs metadata

[package.metadata.smithy-rs-release-tooling]
stable = true
