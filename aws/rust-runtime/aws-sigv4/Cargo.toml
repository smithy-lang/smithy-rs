[package]
name = "aws-sigv4"
version = "1.7.0"
authors = ["AWS Rust SDK Team <aws-sdk-rust@amazon.com>", "David Barsky <me@davidbarsky.com>"]
description = "SigV4 signer for HTTP requests and Event Stream messages."
edition = "2021"
exclude = ["aws-sig-v4-test-suite/*"]
license = "Apache-2.0"
repository = "https://github.com/smithy-lang/smithy-rs"
rust-version = "1.94.1"

[features]
default = ["sign-http", "http1", "rustcrypto"]
http0-compat = ["dep:http0"]
http1 = ["dep:http"]
# NOTE: this deliberately does not enable `dep:http0`. Signing runs on `http` 1.x via
# `SigningInstructions::apply_to_request_http1x`; the only code needing `http` 0.2.x is
# `apply_to_request_http0x`, which is gated on `http0-compat` below.
sign-http = ["dep:percent-encoding", "dep:form_urlencoded"]
sign-eventstream = ["dep:aws-smithy-eventstream"]
sigv4a = ["dep:p256", "dep:crypto-bigint", "dep:subtle", "dep:zeroize"]
# Use the RustCrypto crates (`hmac`, `sha2`, and `p256` under `sigv4a`) for HMAC-SHA256,
# SHA-256, and ECDSA-P256. This is the default and is not FIPS-validated.
#
# `hmac` and `sha2` are optional dependencies gated on this feature, so that a build which selects
# an AWS-LC backend and disables the default features does not compile them at all. That is the
# point of this arrangement: additive features cannot express "on unless AWS-LC is", so the only
# way to keep RustCrypto out of a FIPS build is to make enabling it a choice.
#
# This is a behaviour change shipping under a minor version. `--no-default-features --features
# sign-http,http1` compiled on 1.6.x and loses its backend here; the recovery is to name
# `rustcrypto` alongside the other features. `crypto.rs` emits a `compile_error!` naming the fix
# rather than letting the build fail on an unresolved `hmac` import.
#
# A major was the first choice here and does not work. `aws_runtime::auth::SigningOptions` carries
# a `payload_override: Option<SignableBody<'static>>`, so this crate's types are part of
# `aws-runtime`'s public API, and generated clients construct them through their own `aws-sigv4`
# dependency. The two crates therefore have to move on one compatibility line. `aws-runtime` is
# staying on 1.x (see the comment in its manifest), so a 2.0.0 here would split `SignableBody` in
# two for every already-released client that sets that field -- which `check-semver-hazards`
# catches as a type mismatch when it patches this crate into the last released SDK.
rustcrypto = ["dep:hmac", "dep:sha2"]
# Use aws-lc-rs for HMAC-SHA256, SHA-256, and ECDSA-P256, backed by the non-FIPS AWS-LC build.
#
# Needs a C/C++ compiler, and works on every target aws-lc-rs supports. That is most of what
# the SDK supports, but not all of it: per
# https://aws.github.io/aws-lc-rs/platform_support.html the only WASM target aws-lc-rs supports
# is wasm32-unknown-emscripten, so `wasm32-unknown-unknown` and the WASI targets must stay on
# `rustcrypto`. This is the reason `rustcrypto` remains the default rather than this feature.
#
# Two details about the spelling below, both consequences of `default-features = false` on the
# dependency, which means the AWS-LC build has to be named explicitly:
# - `aws-lc-rs-fips` does not stack on this feature, so enabling `aws-lc-rs-fips` alone compiles
#   only `aws-lc-fips-sys`, not both AWS-LC builds. (rustls stacks its `fips` on its `aws_lc_rs`
#   feature and so always builds both.)
# - This names aws-lc-rs's `aws-lc-sys` feature rather than its `non-fips` feature, because
#   `non-fips` and `fips` are mutually exclusive there — aws-lc-rs fails its build if both are
#   on — and that would make this feature and `aws-lc-rs-fips` impossible to enable together,
#   something `--all-features` and feature unification across a workspace do routinely. With both
#   on, both AWS-LC builds compile and aws-lc-rs uses the FIPS one.
aws-lc-rs = ["__aws-lc-rs", "aws-lc-rs?/aws-lc-sys"]
# Use aws-lc-rs for HMAC-SHA256, SHA-256, and ECDSA-P256, backed by the FIPS 140-3 validated
# AWS-LC build. Takes precedence over `aws-lc-rs` when both are enabled.
#
# Named for the backend it selects, as its `aws-lc-rs` sibling is, rather than `fips`: on a
# generated SDK crate a bare `fips` would sit next to `Config::use_fips`, which selects a
# FIPS-compliant *endpoint* and is unrelated to which module performs the cryptography.
#
# Supported on a subset of the targets above: x86_64 and aarch64 Linux (gnu and musl), `arm`
# musleabi/musleabihf, powerpc/powerpc64/powerpc64le gnu, macOS, 64-bit Windows MSVC, and x86_64
# FreeBSD. Not i686, not riscv64, not s390x, not mips, not NetBSD, not iOS, not Android, not WASM.
# The missing i686 support is why CI excludes this crate from its i686 `--all-features` leg.
# Requires a C/C++ compiler, CMake, and Go at build time, plus bindgen on targets without
# pre-generated FIPS bindings, which is everything except 64-bit Linux and macOS.
#
# Two RustCrypto crates remain compiled in a `sigv4a` + `aws-lc-rs-fips` build, neither of which
# performs FIPS-relevant cryptography: `crypto-bigint`, for the integer math of the SigV4a key
# derivation defined by the signing spec, and `p256`, which the signing path no longer calls but
# which `sigv4a` must keep declaring, because Cargo features are additive and cannot express
# "only when `rustcrypto` is also on".
aws-lc-rs-fips = ["__aws-lc-rs", "aws-lc-rs?/fips"]
# Internal: selects the aws-lc-rs crypto backend. Do not enable directly; use `aws-lc-rs` or
# `aws-lc-rs-fips` instead so that an AWS-LC build is also selected.
__aws-lc-rs = ["dep:aws-lc-rs"]

[dependencies]
aws-credential-types = { path = "../aws-credential-types" }
aws-smithy-eventstream = { path = "../../../rust-runtime/aws-smithy-eventstream", optional = true }
aws-smithy-http = { path = "../../../rust-runtime/aws-smithy-http" }
aws-smithy-runtime-api = { path = "../../../rust-runtime/aws-smithy-runtime-api", features = ["client"] }
aws-smithy-types = { path = "../../../rust-runtime/aws-smithy-types" }
bytes = "1.11.1"
form_urlencoded = { version = "1.2.1", optional = true }
hex = "0.4.3"
http0 = { package = "http" , version = "0.2.12", optional = true }
http = { version = "1.3.1", optional = true }
percent-encoding = { version = "2.3.1", optional = true }
# RustCrypto crypto backend, used unless an AWS-LC arm is selected. `hmac` and `sha2` are optional
# and gated on the `rustcrypto` feature, so that an AWS-LC build with `default-features = false`
# does not compile them. `p256` stays behind `sigv4a`, since it is only needed for SigV4a -- and it
# cannot be gated on `rustcrypto` as well, because features are additive and `sigv4a` has to keep
# naming it even when AWS-LC does the signing.
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
p256 = { version = "0.13.2", features = ["ecdsa"], optional = true }
# aws-lc-rs crypto backend; see the `aws-lc-rs` and `aws-lc-rs-fips` features. `default-features = false`
# so that the AWS-LC build (non-FIPS vs FIPS) is chosen explicitly by those features rather than
# defaulting to the non-FIPS one.
#
# The floor is 1.18 to match the requirement `rustls` declares, so that the signing path and the TLS
# path ask for the same AWS-LC line. Cargo would unify them to one version either way — it resolves a
# single `aws-lc-rs` 1.x for the whole graph, and incompatible requirements force a downgrade
# elsewhere or fail outright rather than producing two copies — so this is not about preventing
# duplicate builds. It is about the requirements saying the same thing as the crate they will be
# resolved alongside, and about `minimal-versions --direct`: that leg pins direct dependencies to
# their declared minimum, so a lower floor here would have CI exercising an AWS-LC line no build
# actually ships.
#
# The floor is also an advisory floor, not an API one: the aws-lc-rs APIs used here compile against
# 1.16.1. Every version from 1.17.3 up has declared ranges for *both* `-sys` crates that exclude
# every version with an open advisory, which matters because this crate offers both AWS-LC arms:
#
#   aws-lc-rs   aws-lc-sys req   aws-lc-fips-sys req
#   1.16.1      ^0.38.0   BAD    ^0.13.1           BAD
#   1.16.2      ^0.39.0   ok     ^0.13.1           BAD
#   1.17.0      ^0.41.0   ok     ^0.13.1           BAD
#   1.17.3      ^0.43.0   ok     ^0.13.16          ok
#   1.18.1      ^0.45.0   ok     ^0.14.2           ok
#
# `aws-lc-sys` needs >= 0.39.0 for RUSTSEC-2026-0044 and -0048 (and >= 0.38.0 for -0045, -0046,
# -0047); `aws-lc-fips-sys` needs >= 0.13.13 for RUSTSEC-2026-0042 and >= 0.13.12 for -0043, which
# the 0.14 line satisfies as well.
aws-lc-rs = { version = "1.18", optional = true, default-features = false }
crypto-bigint = { version = "0.5.4", optional = true }
subtle = { version = "2.5.0", optional = true }
# 0.3.35 is the minimum version that compiles on Rust 1.80+ (earlier versions hit a type inference bug)
time = "0.3.35"
tracing = "0.1.44"
zeroize = { version = "^1.8.1", optional = true }

[dev-dependencies]
aws-credential-types = { path = "../aws-credential-types", features = ["test-util", "hardcoded-credentials"] }
aws-smithy-runtime-api = { path = "../../../rust-runtime/aws-smithy-runtime-api", features = ["client", "test-util"] }
bytes = "1.11.1"
hex-literal = "0.4.1"
httparse = "1.10.1"
pretty_assertions = "1.3"
proptest = "1.2"
serde = "1.0.180"
serde_derive = "1.0.180"
serde_json = "1.0.104"
time = { version = "0.3.5", features = ["parsing"] }

criterion = "0.8.2"

[[bench]]
name = "hmac"
harness = false

[[bench]]
name = "sigv4a"
harness = false
required-features = ["sigv4a"]

# These three are the RustCrypto backend. Making them optional means a deliberate AWS-LC build
# (`--no-default-features` plus an AWS-LC arm) does not compile them at all, so there is nothing for
# udeps to flag there. This list is still required for one configuration: `--all-features`, which CI
# runs udeps under, enables `rustcrypto` *and* an AWS-LC arm, so the crates are present while the cfg
# routes around them. They are the live backend in a default build, so they are not dead
# dependencies -- only dead in that combination. `p256` is additionally used by the test-side SigV4a
# verifier on both backends, which doesn't save it here because cargo-udeps only inspects the lib
# target.
[package.metadata.cargo-udeps.ignore]
normal = ["hmac", "sha2", "p256"]

[package.metadata.docs.rs]
# `all-features` is off because the `aws-lc-rs-fips` feature builds aws-lc-fips-sys, which can't
# build on docs.rs. `sdk-lints` grants this crate an exception for that reason.
all-features = false
features = ["sign-http", "sign-eventstream", "sigv4a", "http0-compat", "http1", "rustcrypto", "aws-lc-rs"]
targets = ["x86_64-unknown-linux-gnu"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]
# End of docs.rs metadata

[package.metadata.smithy-rs-release-tooling]
stable = true
